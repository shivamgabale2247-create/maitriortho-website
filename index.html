        function attachPatientPortalListeners() {
            document.getElementById('patient-portal-logout')?.addEventListener('click', () => {
                clearPatientPortalSession();
                appState.portalMode = 'patient';
                appState.currentView = 'login';
                render();
            });

            const form = document.getElementById('patient-appointment-form');
            form?.addEventListener('submit', async e => {
                e.preventDefault();
                const date = document.getElementById('patient-book-date')?.value || '';
                const time = document.getElementById('patient-book-time')?.value || '';
                const reason = document.getElementById('patient-book-reason')?.value || '';
                const submit = form.querySelector('button[type="submit"]');
                submit.disabled = true;
                submit.classList.add('opacity-60');
                submit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Sending Request…</span>';
                try {
                    await requestPatientPortalAppointment(date, time, reason);
                    showToast('Appointment request sent to your doctor.');
                    render();
                } catch (error) {
                    console.error(error);
                    showToast(error.message || 'Appointment request failed.', 'error');
                    submit.disabled = false;
                    submit.classList.remove('opacity-60');
                    submit.innerHTML = '<i class="fa-solid fa-calendar-plus"></i><span>Request Appointment</span>';
                }
            });
        }

            return String(value ?? '')

                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#039;');

            { title: 'FUNCTIONAL EXAMINATION', fields: [
                ['respiration', 'Respiration', 'select:Nasal|Oral|Oro-nasal'], ['deglutition', 'Deglutition', 'select:Normal|Tongue thrusting|Abnormal'], ['speech', 'Speech', 'select:Normal|Abnormal'], ['maximum_opening', 'Maximum mouth opening', 'text'], ['interocclusal_clearance', 'Interocclusal clearance', 'text'], ['tmj', 'Examination of TMJ', 'select:Normal|Clicking|Pain|Tenderness'], ['mandibular_closure', 'Path of closure mandible', 'textarea'], ['prematurities', 'Occlusal prematurities', 'textarea'], ['incisor_exposure_rest', 'Incisor exposure — rest', 'text'], ['incisor_exposure_smile', 'Incisor exposure — smile', 'text'], ['protrusion', 'Protrusion', 'textarea'], ['lateral_excursion_right', 'Lateral excursion — Right', 'text'], ['lateral_excursion_left', 'Lateral excursion — Left', 'text'], ['functional_remarks', 'If any / Remarks', 'textarea']

            ]}
        ];

        function caseSheetValue(store, key) {
            return (store && store[key]?.value) ?? '';
        }
        function caseSheetInference(store, key) {
            return (store && store[key]?.inference) ?? '';
        }
        function caseSheetRemark(store, key) {
            return (store && store[key]?.remark) ?? '';
        }
        function escCase(value) { return escapeHtml(value == null ? '' : String(value)); }

        function renderCaseField(field, store, includeInference = false, inferenceGroup = 'normal') {
            const [key, label, type] = field;
            const value = caseSheetValue(store, key);
            const remark = caseSheetRemark(store, key);
            let control = '';
            if (type.startsWith('select:')) {
                const opts = type.slice(7).split('|');
                control = `<select data-cs-value="${key}" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"><option value="">Select…</option>${opts.map(o => `<option ${value === o ? 'selected' : ''}>${escCase(o)}</option>`).join('')}</select>`;
            } else if (type === 'textarea') {
                control = `<textarea data-cs-value="${key}" rows="3" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white text-sm resize-y focus:outline-none focus:ring-2 focus:ring-emerald-500">${escCase(value)}</textarea>`;
            } else if (type === 'date') {
                control = `<input type="date" data-cs-value="${key}" value="${escCase(value)}" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">`;
            } else if (type === 'checkbox') {
                control = `<label class="inline-flex items-center gap-2 text-sm"><input type="checkbox" data-cs-value="${key}" ${value === 'true' ? 'checked' : ''} class="w-4 h-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500"><span>${escCase(label)}</span></label>`;
                return `<div class="bg-white border border-slate-200 rounded-xl p-3">${control}</div>`;
            } else if (type === 'yesno') {
                control = `<select data-cs-value="${key}" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"><option value="">Select…</option><option ${value === 'Yes' ? 'selected' : ''}>Yes</option><option ${value === 'No' ? 'selected' : ''}>No</option></select>`;
            } else {
                control = `<input type="text" data-cs-value="${key}" value="${escCase(value)}" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">`;
            }
            let inference = '';
            if (includeInference) {
                const options = INFERENCE_OPTIONS[inferenceGroup] || INFERENCE_OPTIONS.normal;
                const inf = caseSheetInference(store, key);
                const showOther = inf === 'Other / clinician wording';
                inference = `
                    <div class="mt-2 grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_minmax(0,1fr)] gap-2">
                        <select data-cs-inference="${key}" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="">Inference ▼</option>${options.map(o => `<option ${inf === o ? 'selected' : ''}>${escCase(o)}</option>`).join('')}
                        </select>
                        <input type="text" data-cs-remark="${key}" value="${escCase(remark)}" placeholder="If any / remarks" class="w-full px-3 py-2 rounded-lg border border-slate-200 ${showOther ? 'bg-white' : 'bg-slate-50'} text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>`;
            } else if (type !== 'textarea' && type !== 'checkbox') {
                inference = `<input type="text" data-cs-remark="${key}" value="${escCase(remark)}" placeholder="If any / remarks" class="mt-2 w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500">`;
            }
            return `<div class="bg-white border border-slate-200 rounded-xl p-3"><div class="grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_minmax(0,1.6fr)] gap-3 items-start"><label class="text-sm font-semibold text-slate-700 pt-2">${escCase(label)}</label><div>${control}${inference}</div></div></div>`;
        }

        function renderCaseHistorySheet(patient) {
            const store = patient.caseSheets?.case_history || {};

        function renderModelAnalysisSheet(patient) {

        async function loadCaseSheetsForPatient(patientId) {
            const patient = appState.patients.find(p => p.id === patientId);
            if (!patient || !patientId || patient.caseSheetsLoaded) return;
            appState.caseSheetLoading = true;
            try {
                const { data, error } = await supabaseClient
                    .from('patient_case_sheets')
                    .select('*')
                    .eq('patient_id', patientId);
                if (error) throw error;
                patient.caseSheets = { case_history: {}, model_analysis: {}, diagnosis_plan: {} };
                (data || []).forEach(row => { if (CASE_SHEET_TYPES[row.sheet_type]) patient.caseSheets[row.sheet_type] = row.data || {}; });
                patient.caseSheetsLoaded = true;
            } finally {
                appState.caseSheetLoading = false;
            }
        }

        async function ensureCaseSheetsLoaded(patientId) {
            if (!patientId) return;
            const patient = appState.patients.find(p => p.id === patientId);
            if (!patient || patient.caseSheetsLoaded) return;
            try {
                await loadCaseSheetsForPatient(patientId);
                if (appState.currentView === 'patient_detail' && appState.selectedPatientId === patientId && appState.activeSubTab === 'case_sheets') render();
            } catch (error) {
                console.error(error);
                showToast(`Unable to load case sheets: ${error.message || 'Unknown error'}`, 'error');
            }
        }

        function collectCaseSheetForm() {
            const out = {};
            document.querySelectorAll('[data-cs-value]').forEach(el => {
                const key = el.getAttribute('data-cs-value');
                let value = '';
                if (el.type === 'checkbox') value = el.checked ? 'true' : 'false';
                else value = el.value || '';
                out[key] = { ...(out[key] || {}), value };
            });
            document.querySelectorAll('[data-cs-inference]').forEach(el => {
                const key = el.getAttribute('data-cs-inference');
                out[key] = { ...(out[key] || {}), inference: el.value || '' };
            });
            document.querySelectorAll('[data-cs-remark]').forEach(el => {
                const key = el.getAttribute('data-cs-remark');
                out[key] = { ...(out[key] || {}), remark: el.value || '' };
            });
            return out;
        }

        async function saveCaseSheetToCloud(patient, sheetType, payload) {
            if (!patient?.id || isAdminViewingDoctor()) throw new Error('Administrator view is read-only.');
            const ownerId = patient.ownerId || appState.user?.id;
            if (!ownerId) throw new Error('Patient owner could not be identified.');
            const { data, error } = await supabaseClient
                .from('patient_case_sheets')
                .upsert({ owner_id: ownerId, patient_id: patient.id, sheet_type: sheetType, data: payload, updated_at: new Date().toISOString() }, { onConflict: 'patient_id,sheet_type' })
                .select('*')
                .single();
            if (error) throw error;
            if (!patient.caseSheets) patient.caseSheets = { case_history: {}, model_analysis: {}, diagnosis_plan: {} };
            patient.caseSheets[sheetType] = data.data || {};
            patient.caseSheetsLoaded = true;
            return data;
        }

        function bindCaseSheetOtherHints() {
            document.querySelectorAll('[data-cs-inference]').forEach(sel => {
                sel.addEventListener('change', () => {
                    const key = sel.getAttribute('data-cs-inference');
                    const remark = document.querySelector(`[data-cs-remark="${CSS.escape(key)}"]`);
                    if (remark && sel.value === 'Other / clinician wording') { remark.classList.remove('bg-slate-50'); remark.classList.add('bg-white'); remark.focus(); }
                });
            });
        }

        function bindCaseSheetListeners() {
            if (isAdminViewingDoctor()) {
                document.querySelectorAll('[data-cs-value], [data-cs-inference], [data-cs-remark]').forEach(el => {
                    el.disabled = true;
                    el.setAttribute('aria-readonly', 'true');
                });
            }
            document.querySelectorAll('.case-sheet-nav').forEach(btn => {
                btn.addEventListener('click', () => {
                    appState.activeCaseSheet = btn.getAttribute('data-case-sheet') || 'case_history';
                    appState.caseModelSection = 'model';
                    render();
                });
            });
            document.querySelectorAll('.case-model-section').forEach(btn => {
                btn.addEventListener('click', () => {
                    appState.caseModelSection = btn.getAttribute('data-model-section') || 'model';
                    render();
                });
            });
            bindCaseSheetOtherHints();

            const saveBtn = document.getElementById('case-sheet-save');
            if (saveBtn && !isAdminViewingDoctor()) saveBtn.addEventListener('click', async () => {
                const patient = appState.patients.find(p => p.id === appState.selectedPatientId);
                if (!patient) return;
                saveBtn.disabled = true;
                saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i>Saving…';
                try {
                    const payload = collectCaseSheetForm();
                    await saveCaseSheetToCloud(patient, appState.activeCaseSheet, payload);

                    render();
                } catch (error) {
                    console.error(error);

                    saveBtn.disabled = false;
                    saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1.5"></i>Save';
                }
            });

            document.getElementById('case-sheet-print')?.addEventListener('click', () => window.print());

                if (!confirm('Clear this entire case sheet? This removes the saved sheet data for this patient.')) return;
                const patient = appState.patients.find(p => p.id === appState.selectedPatientId);
                if (!patient) return;
                try {
                    const ownerId = patient.ownerId || appState.user?.id;
                    const { error } = await supabaseClient.from('patient_case_sheets').delete().eq('patient_id', patient.id).eq('sheet_type', appState.activeCaseSheet).eq('owner_id', ownerId);

                    render();

                    showToast(`Case sheet could not be cleared: ${error.message || 'Unknown error'}`, 'error');
                }
            });
        }

        function renderModal() {
            if (appState.modalType === 'add_patient') {
                return `
                    <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
                        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden">
                            <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                                <h3 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-user-plus text-emerald-400"></i> Add New Patient</h3>
                                <button id="modal-close" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
                            </div>
                            <form id="add-patient-form" class="p-6 space-y-4">
                                <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-xs text-emerald-800 flex items-start gap-2">
                                    <i class="fa-solid fa-id-card mt-0.5"></i>
                                    <div><strong>Patient ID:</strong> A unique 5-digit ID will be generated automatically when you create this patient. Keep this ID for the future patient portal.</div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Patient Full Name</label>
                                    <input type="text" id="new-name" required placeholder="e.g. Sarah Connor" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Age</label>
                                        <input type="number" id="new-age" required min="3" max="99" value="15" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Gender</label>
                                        <select id="new-gender" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                            <option value="Female">Female</option>
                                            <option value="Male">Male</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Phone</label>
                                        <input type="text" id="new-phone" required placeholder="+1 (555) 000-0000" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Status</label>
                                        <select id="new-status" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                            <option value="Active">Active Treatment</option>
                                            <option value="Retention">Retention</option>
                                            <option value="Completed">Completed</option>
                                        </select>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Malocclusion / Chief Complaint</label>
                                    <input type="text" id="new-malocclusion" required placeholder="e.g. Class II Division 1" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                </div>
                                <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                                    <button type="button" id="modal-cancel" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 cursor-pointer">Cancel</button>
                                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-emerald-600 text-white shadow-md cursor-pointer">Create Patient Folder</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            } else if (appState.modalType === 'add_appointment') {
                const today = localDateISO();
                return `
                    <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
                        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden">
                            <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                                <h3 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-calendar-plus text-emerald-400"></i> New Appointment</h3>
                                <button id="modal-close" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
                            </div>
                            <form id="add-appointment-form" class="p-6 space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Patient</label>
                                    <select id="appointment-patient" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                        <option value="">Select patient…</option>
                                        ${(appState.patients || []).map(p => `<option value="${p.id}">${escapeHtml(p.name)}${p.patientCode ? ' — ID ' + escapeHtml(p.patientCode) : ''}${p.phone ? ' — ' + escapeHtml(p.phone) : ''}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Date</label>
                                        <input type="date" id="appointment-date" required value="${today}" min="${today}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Time</label>
                                        <input type="time" id="appointment-time" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Planned Work / Reason</label>
                                    <input type="text" id="appointment-planned-work" placeholder="e.g. Wire change / review / IPR" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Notes</label>
                                    <textarea id="appointment-notes" rows="3" placeholder="Optional appointment notes…" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                                </div>
                                <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                                    <button type="button" id="modal-cancel" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 cursor-pointer">Cancel</button>
                                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-emerald-600 text-white shadow-md cursor-pointer">Create Appointment</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            } else if (appState.modalType === 'reschedule_appointment') {
                const appointment = appState.appointments.find(a => a.id === appState.rescheduleAppointmentId);
                if (!appointment) return '';
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                const minDate = localDateISO(tomorrow);
                return `
                    <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
                        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden">
                            <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                                <div><h3 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-calendar-arrow-up text-emerald-400"></i> Reschedule Appointment</h3><p class="text-[11px] text-slate-400 mt-1">${escapeHtml(humanDate(appointment.appointmentDate))}${appointment.appointmentTime ? ` • ${escapeHtml(formatAppointmentTime(appointment.appointmentTime))}` : ''}</p></div>
                                <button id="modal-close" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
                            </div>
                            <form id="reschedule-appointment-form" class="p-6 space-y-4">
                                <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800"><i class="fa-solid fa-circle-info mr-1.5"></i>The original appointment remains in the history. It will be marked <strong>${appointment.status === 'no_show' ? 'No-show' : 'Rescheduled'}</strong> and a new appointment will be created.</div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">New Date</label>
                                        <input type="date" id="reschedule-date" required min="${minDate}" value="${minDate}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">New Time</label>
                                        <input type="time" id="reschedule-time" required value="${escapeHtml(appointment.appointmentTime || '17:00').slice(0,5)}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Reason / Note</label>
                                    <textarea id="reschedule-note" rows="3" placeholder="e.g. Patient requested a later date…" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                                </div>
                                <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                                    <button type="button" id="modal-cancel" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 cursor-pointer">Cancel</button>
                                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-emerald-600 text-white shadow-md cursor-pointer"><i class="fa-solid fa-calendar-check mr-1.5"></i>Save New Appointment</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            } else if (appState.modalType === 'upload_photo') {
                return `
                    <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
                        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
                            <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                                <h3 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-cloud-arrow-up text-emerald-400"></i> Upload Clinical Record</h3>
                                <button id="modal-close" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
                            </div>
                            <form id="upload-form" class="p-6 space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Caption / Notes</label>
                                    <input type="text" id="upload-caption" placeholder="e.g. Initial alignment progress" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Select Image File</label>
                                    <input type="file" id="upload-file-input" required accept="image/*" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                    <div class="mt-2 flex items-start gap-2 text-[11px] leading-4 text-slate-500">
                                        <i class="fa-solid fa-compress text-emerald-600 mt-0.5"></i>
                                        <span>Photos are automatically optimized in your browser before upload to reduce Supabase storage use. Clinical proportions are preserved; photographs are targeted around 2000 px and radiographs around 2400 px.</span>
                                    </div>
                                </div>
                                <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                                    <button type="button" id="modal-cancel" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 cursor-pointer">Cancel</button>
                                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-emerald-600 text-white shadow-md cursor-pointer">Upload & Save</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            }
            return '';
        }
    </script>
</body>
</html>
