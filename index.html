<body class="h-full bg-slate-100 text-slate-800 antialiased flex flex-col">

    <!-- App Root Container -->
    <div id="app" class="flex-1 flex flex-col h-full overflow-hidden"></div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        const SUPABASE_BUCKET = 'clinical-records';
        const MAX_UPLOAD_BYTES = 10 * 1024 * 1024;
        const CONFIG = window.MAITRIORTHO_CONFIG || {};
        const SUPABASE_URL = (CONFIG.SUPABASE_URL || '').trim();
        const SUPABASE_PUBLISHABLE_KEY = (CONFIG.SUPABASE_PUBLISHABLE_KEY || '').trim();
        const SUPABASE_CONFIGURED = Boolean(SUPABASE_URL && SUPABASE_PUBLISHABLE_KEY && window.supabase);
        const supabaseClient = SUPABASE_CONFIGURED
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
            : null;

        let appState = {
            doctorName: '',
            doctorEmail: '',
            currentView: 'login',
            selectedPatientId: null,
            activeStageTab: 'pre',
            activeSubTab: 'extraoral',
            searchQuery: '',
            statusFilter: 'all',
            modalOpen: false,
            modalType: null,
            activePhotoSlot: null,
            patients: [],
            authMode: 'login',
            booting: true,
            user: null,
            authLoadingUserId: null,
            role: 'doctor',
            doctors: [],
            viewingDoctorId: null,
            viewingDoctorName: '',
            viewingDoctorEmail: ''
        };

        function todayISO() {
            return new Date().toISOString().split('T')[0];
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800';
            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium transform translate-y-2 opacity-0 transition-all duration-300 pointer-events-auto`;
            const icon = document.createElement('i');
            icon.className = `fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'} text-lg`;
            const span = document.createElement('span');
            span.textContent = message;
            toast.append(icon, span);
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function renderLoading() {
            return `
                <div class="flex-1 flex items-center justify-center bg-slate-100 p-4">
                    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 text-center max-w-md w-full">
                        <div class="w-16 h-16 bg-emerald-600 text-white rounded-2xl flex items-center justify-center text-3xl font-bold mx-auto mb-4 shadow-lg shadow-emerald-600/30">
                            <i class="fa-solid fa-tooth"></i>
                        </div>
                        <h2 class="text-xl font-bold text-slate-800">MaitriOrtho</h2>
                        <p class="text-sm text-slate-500 mt-2">Connecting securely to your clinical workspace…</p>
                        <div class="mt-5 h-1.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-emerald-600 rounded-full animate-pulse w-2/3 mx-auto"></div></div>
                    </div>
                </div>
            `;
        }

        function renderSetupRequired() {
            return `
                <div class="flex-1 flex items-center justify-center bg-gradient-to-br from-teal-900 via-slate-900 to-emerald-950 p-4 relative overflow-hidden">
                    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#38bdf8_1px,transparent_1px)] [background-size:16px_16px]"></div>
                    <div class="max-w-lg w-full bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-white/20 relative z-10 text-center">
                        <div class="w-16 h-16 bg-emerald-600 text-white rounded-2xl flex items-center justify-center text-3xl font-bold mx-auto mb-4 shadow-lg shadow-emerald-600/30">
                            <i class="fa-solid fa-tooth"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-slate-900">maitriortho.in</h1>
                        <p class="text-slate-500 text-sm mt-1">Secure cloud configuration required</p>
                        <div class="mt-6 text-left bg-slate-50 border border-slate-200 rounded-xl p-4 text-xs text-slate-600">
                            <p class="font-semibold text-slate-800 mb-2">Finish setup before using the portal</p>
                            <p>Open <strong>config.js</strong> in this website and enter your Supabase Project URL and Publishable Key. Do not put a service-role/secret key here.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;
            app.innerHTML = '';

            if (!SUPABASE_CONFIGURED) {
                app.innerHTML = renderSetupRequired();
                return;
            }

            if (appState.booting) {
                app.innerHTML = renderLoading();
                return;
            }

            if (appState.currentView === 'login') {
                app.innerHTML = renderLogin();
                attachLoginListeners();
            } else if (appState.currentView === 'admin_dashboard') {
                app.innerHTML = renderAdminDashboard();
                attachAdminDashboardListeners();
            } else if (appState.currentView === 'dashboard') {
                app.innerHTML = renderDashboard();
                attachDashboardListeners();
            } else if (appState.currentView === 'patient_detail') {
                app.innerHTML = renderPatientDetail();
                attachPatientDetailListeners();
            }

            if (appState.modalOpen) {
                app.innerHTML += renderModal();
                attachModalListeners();
            }
        }

        function emptyStages() {
            return {
                pre: { extraoral: {}, intraoral: {}, cephalogram: {}, opg: {}, extra_records: {} },
                mid: { extraoral: {}, intraoral: {}, cephalogram: {}, opg: {}, extra_records: {} },
                post: { extraoral: {}, intraoral: {}, cephalogram: {}, opg: {}, extra_records: {} }
            };
        }

        function mapPatientRow(row) {
            return {
                id: row.id,
                name: row.name || '',
                age: row.age ?? '',
                gender: row.gender || '',
                phone: row.phone || '',
                malocclusion: row.malocclusion || '',
                startDate: row.start_date || todayISO(),
                status: row.status || 'Active',
                lastVisit: row.last_visit || row.start_date || todayISO(),
                treatmentPlan: row.treatment_plan || '',
                stages: emptyStages()
            };
        }

        function setRecordInPatient(patient, record, signedUrl = '') {
            const stage = patient.stages[record.stage];
            if (!stage || !stage[record.category]) return;
            stage[record.category][record.slot] = {
                url: signedUrl || '',
                caption: record.caption || 'Clinical Record',
                storagePath: record.storage_path || '',
                recordId: record.id,
                contentType: record.content_type || '',
                originalFilename: record.original_filename || ''
            };
        }

        async function loadProfile(user) {
            const { data, error } = await supabaseClient
                .from('profiles')
                .select('doctor_name,email,role')
                .eq('id', user.id)
                .maybeSingle();
            if (error) throw error;
            appState.doctorName = data?.doctor_name || user.user_metadata?.doctor_name || 'Doctor';
            appState.doctorEmail = data?.email || user.email || '';
            appState.role = data?.role || 'doctor';
        }

        async function signedUrlFor(path) {
            if (!path) return '';
            const { data, error } = await supabaseClient.storage
                .from(SUPABASE_BUCKET)
                .createSignedUrl(path, 3600);
            if (error) {
                console.warn('Signed URL generation failed:', error.message);
                return '';
            }
            return data?.signedUrl || '';
        }

        async function loadCloudPatients(ownerId = null) {
            let patientQuery = supabaseClient
                .from('patients')
                .select('*')
                .order('created_at', { ascending: false });
            if (ownerId) patientQuery = patientQuery.eq('owner_id', ownerId);

            const { data: patientRows, error: patientError } = await patientQuery;
            if (patientError) throw patientError;

            const patients = (patientRows || []).map(mapPatientRow);
            if (!patients.length) return patients;

            const patientIds = patients.map(p => p.id);
            const { data: recordRows, error: recordError } = await supabaseClient
                .from('clinical_records')
                .select('*')
                .in('patient_id', patientIds)
                .order('created_at', { ascending: true });
            if (recordError) throw recordError;

            const byId = new Map(patients.map(p => [p.id, p]));
            await Promise.all((recordRows || []).map(async record => {
                const patient = byId.get(record.patient_id);
                if (!patient) return;
                const url = await signedUrlFor(record.storage_path);
                setRecordInPatient(patient, record, url);
            }));
            return patients;
        }

        async function loadDoctorsForAdmin() {
            const { data: doctorRows, error: doctorError } = await supabaseClient
                .from('profiles')
                .select('id,doctor_name,email,role,created_at')
                .eq('role', 'doctor')
                .order('doctor_name', { ascending: true });
            if (doctorError) throw doctorError;

            const { data: patientRows, error: patientError } = await supabaseClient
                .from('patients')
                .select('owner_id');
            if (patientError) throw patientError;

            const counts = new Map();
            (patientRows || []).forEach(row => counts.set(row.owner_id, (counts.get(row.owner_id) || 0) + 1));

            appState.doctors = (doctorRows || []).map(d => ({
                id: d.id,
                name: d.doctor_name || 'Doctor',
                email: d.email || '',
                patientCount: counts.get(d.id) || 0,
                createdAt: d.created_at || ''
            }));
            return appState.doctors;
        }

        function isAdminViewingDoctor() {
            return appState.role === 'admin' && Boolean(appState.viewingDoctorId);
        }

        async function finishAuthentication(user) {
            if (!user || appState.authLoadingUserId === user.id) return;
            appState.authLoadingUserId = user.id;
            appState.user = user;
            appState.booting = true;
            render();
            try {
                await loadProfile(user);
                appState.viewingDoctorId = null;
                appState.viewingDoctorName = '';
                appState.viewingDoctorEmail = '';
                if (appState.role === 'admin') {
                    appState.doctors = await loadDoctorsForAdmin();
                    appState.patients = [];
                    appState.currentView = 'admin_dashboard';
                } else {
                    appState.patients = await loadCloudPatients(user.id);
                    appState.currentView = 'dashboard';
                }
                appState.booting = false;
                render();
            } catch (error) {
                console.error(error);
                appState.booting = false;
                await supabaseClient.auth.signOut();
                appState.user = null;
                appState.currentView = 'login';
                render();
                showToast(`Unable to load your clinical workspace: ${error.message || 'Unknown error'}`, 'error');
            } finally {
                appState.authLoadingUserId = null;
            }
        }

        function setAuthBusy(isBusy, text) {
            const btn = document.querySelector('#login-form button[type="submit"]');
            if (!btn) return;
            btn.disabled = isBusy;
            btn.classList.toggle('opacity-60', isBusy);
            const span = btn.querySelector('span');
            if (span) span.textContent = text;
        }

        function attachLoginListeners() {
            const form = document.getElementById('login-form');
            document.getElementById('auth-mode-toggle')?.addEventListener('click', () => {
                appState.authMode = appState.authMode === 'login' ? 'signup' : 'login';
                render();
            });

            form?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('doctor-email')?.value.trim() || '';
                const password = document.getElementById('doctor-password')?.value || '';
                const name = document.getElementById('doctor-name')?.value.trim() || '';
                if (!email || !password || (appState.authMode === 'signup' && !name)) return;
                if (password.length < 8) {
                    showToast('Password must contain at least 8 characters.', 'error');
                    return;
                }

                setAuthBusy(true, appState.authMode === 'login' ? 'Signing in…' : 'Creating account…');
                try {
                    if (appState.authMode === 'login') {
                        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                        await finishAuthentication(data.user);
                    } else {
                        const { data, error } = await supabaseClient.auth.signUp({
                            email,
                            password,
                            options: {
                                data: { doctor_name: name },
                                emailRedirectTo: window.location.href
                            }
                        });
                        if (error) throw error;
                        if (data.session && data.user) {
                            await finishAuthentication(data.user);
                        } else {
                            showToast('Account created. Check your email to confirm the account, then sign in.', 'info');
                            appState.authMode = 'login';
                            render();
                        }
                    }
                } catch (error) {
                    console.error(error);
                    showToast(error.message || 'Authentication failed.', 'error');
                    setAuthBusy(false, appState.authMode === 'login' ? 'Access Doctor Portal' : 'Create Doctor Account');
                }
            });
        }

        async function deletePatientFromCloud(patientId) {
            const { data: records, error: recordError } = await supabaseClient
                .from('clinical_records')
                .select('storage_path')
                .eq('patient_id', patientId);
            if (recordError) throw recordError;

            const paths = (records || []).map(r => r.storage_path).filter(Boolean);
            if (paths.length) {
                const { error: storageError } = await supabaseClient.storage
                    .from(SUPABASE_BUCKET)
                    .remove(paths);
                if (storageError) console.warn('Some clinical files could not be removed:', storageError.message);
            }

            const { error } = await supabaseClient.from('patients').delete().eq('id', patientId);
            if (error) throw error;
        }

        async function createPatientInCloud(form) {
            const payload = {
                owner_id: appState.user.id,
                name: form.name.trim(),
                age: Number.parseInt(form.age, 10),
                gender: form.gender,
                phone: form.phone.trim(),
                malocclusion: form.malocclusion.trim(),
                start_date: todayISO(),
                status: form.status,
                last_visit: todayISO(),
                treatment_plan: 'Initial orthodontic records taken.'
            };
            const { data, error } = await supabaseClient
                .from('patients')
                .insert(payload)
                .select('*')
                .single();
            if (error) throw error;
            return mapPatientRow(data);
        }

        async function saveTreatmentPlanToCloud(patient, text) {
            const { data, error } = await supabaseClient
                .from('patients')
                .update({ treatment_plan: text, last_visit: todayISO(), updated_at: new Date().toISOString() })
                .eq('id', patient.id)
                .select('*')
                .single();
            if (error) throw error;
            patient.treatmentPlan = data.treatment_plan || '';
            patient.lastVisit = data.last_visit || patient.lastVisit;
        }

        function getFileExtension(file) {
            const name = file.name || '';
            const dot = name.lastIndexOf('.');
            if (dot >= 0) return name.slice(dot).toLowerCase().replace(/[^a-z0-9.]/g, '');
            const type = (file.type || '').toLowerCase();
            return type === 'image/png' ? '.png' : type === 'image/webp' ? '.webp' : '.jpg';
        }

        async function uploadClinicalRecord({ patient, category, slot, stage, file, caption }) {
            if (!file) throw new Error('Please select an image file.');
            if (!file.type?.startsWith('image/')) throw new Error('Only image files are accepted.');
            if (file.size > MAX_UPLOAD_BYTES) throw new Error('Please choose an image smaller than 10 MB.');

            const existing = patient.stages?.[stage]?.[category]?.[slot] || {};
            const extension = getFileExtension(file);
            const path = `${appState.user.id}/${patient.id}/${stage}/${category}/${slot}-${crypto.randomUUID()}${extension}`;

            const { error: uploadError } = await supabaseClient.storage
                .from(SUPABASE_BUCKET)
                .upload(path, file, {
                    cacheControl: '3600',
                    contentType: file.type,
                    upsert: false
                });
            if (uploadError) throw uploadError;

            const { data: row, error: dbError } = await supabaseClient
                .from('clinical_records')
                .upsert({
                    owner_id: appState.user.id,
                    patient_id: patient.id,
                    stage,
                    category,
                    slot,
                    storage_path: path,
                    caption: caption || 'Clinical Record',
                    original_filename: file.name || '',
                    content_type: file.type || '',
                    size_bytes: file.size
                }, { onConflict: 'patient_id,stage,category,slot' })
                .select('*')
                .single();

            if (dbError) {
                await supabaseClient.storage.from(SUPABASE_BUCKET).remove([path]);
                throw dbError;
            }

            if (existing.storagePath && existing.storagePath !== path) {
                const { error: oldRemoveError } = await supabaseClient.storage.from(SUPABASE_BUCKET).remove([existing.storagePath]);
                if (oldRemoveError) console.warn('Old file could not be removed:', oldRemoveError.message);
            }

            const signedUrl = await signedUrlFor(path);
            setRecordInPatient(patient, row, signedUrl);
        }

        async function deleteClinicalRecord(patient, category, slot, stage) {
            const record = patient.stages?.[stage]?.[category]?.[slot] || {};
            if (!record.recordId && !record.storagePath) return;

            if (record.storagePath) {
                const { error: storageError } = await supabaseClient.storage.from(SUPABASE_BUCKET).remove([record.storagePath]);
                if (storageError) console.warn('File removal warning:', storageError.message);
            }

            if (record.recordId) {
                const { error } = await supabaseClient.from('clinical_records').delete().eq('id', record.recordId);
                if (error) throw error;
            } else {
                const { error } = await supabaseClient
                    .from('clinical_records')
                    .delete()
                    .eq('patient_id', patient.id)
                    .eq('stage', stage)
                    .eq('category', category)
                    .eq('slot', slot);
                if (error) throw error;
            }

            patient.stages[stage][category][slot] = {};
        }

        function attachDashboardListeners() {
            document.getElementById('btn-back-to-doctors')?.addEventListener('click', async () => {
                appState.viewingDoctorId = null;
                appState.viewingDoctorName = '';
                appState.viewingDoctorEmail = '';
                appState.patients = [];
                appState.booting = true;
                render();
                try {
                    appState.doctors = await loadDoctorsForAdmin();
                    appState.currentView = 'admin_dashboard';
                } catch (error) {
                    console.error(error);
                    showToast(`Unable to reload doctors: ${error.message || 'Unknown error'}`, 'error');
                    appState.currentView = 'admin_dashboard';
                } finally {
                    appState.booting = false;
                    render();
                }
            });

            document.getElementById('btn-logout')?.addEventListener('click', async () => {
                try {
                    await supabaseClient.auth.signOut();
                } finally {
                    appState.doctorName = '';
                    appState.doctorEmail = '';
                    appState.role = 'doctor';
                    appState.currentView = 'login';
                    appState.selectedPatientId = null;
                    appState.patients = [];
                    appState.doctors = [];
                    appState.viewingDoctorId = null;
                    appState.viewingDoctorName = '';
                    appState.viewingDoctorEmail = '';
                    appState.user = null;
                    appState.authMode = 'login';
                    render();
                }
            });

            if (!isAdminViewingDoctor()) {
                document.getElementById('btn-add-patient')?.addEventListener('click', () => {
                    appState.modalOpen = true;
                    appState.modalType = 'add_patient';
                    render();
                });
            }

            document.getElementById('patient-search')?.addEventListener('input', (e) => {
                appState.searchQuery = e.target.value;
            });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    appState.statusFilter = e.currentTarget.getAttribute('data-filter');
                    render();
                });
            });

            document.querySelectorAll('.open-patient').forEach(el => {
                el.addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    if (id) {
                        appState.selectedPatientId = id;
                        appState.currentView = 'patient_detail';
                        appState.activeStageTab = 'pre';
                        appState.activeSubTab = 'extraoral';
                        render();
                    }
                });
            });

            if (!isAdminViewingDoctor()) document.querySelectorAll('.delete-patient').forEach(el => {
                el.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const id = e.currentTarget.getAttribute('data-id');
                    if (!id || !confirm('Are you sure you want to delete this patient folder? This also removes its uploaded clinical files.')) return;
                    try {
                        await deletePatientFromCloud(id);
                        appState.patients = appState.patients.filter(p => p.id !== id);
                        showToast('Patient folder deleted.', 'error');
                        render();
                    } catch (error) {
                        console.error(error);
                        showToast(`Patient could not be deleted: ${error.message || 'Unknown error'}`, 'error');
                    }
                });
            });
        }

        function attachPatientDetailListeners() {
            document.getElementById('btn-back')?.addEventListener('click', () => {
                appState.currentView = 'dashboard';
                appState.selectedPatientId = null;
                render();
            });

            document.querySelectorAll('.stage-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    appState.activeStageTab = e.currentTarget.getAttribute('data-stage');
                    render();
                });
            });

            document.querySelectorAll('.subtab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    appState.activeSubTab = e.currentTarget.getAttribute('data-subtab');
                    render();
                });
            });

            if (!isAdminViewingDoctor()) document.getElementById('btn-save-plan')?.addEventListener('click', async (e) => {
                const p = appState.patients.find(x => x.id === appState.selectedPatientId);
                const txt = document.getElementById('treatment-plan-textarea')?.value || '';
                const btn = e.currentTarget;
                if (!p) return;
                btn.disabled = true;
                try {
                    await saveTreatmentPlanToCloud(p, txt);
                    showToast('Treatment plan saved successfully.');
                } catch (error) {
                    console.error(error);
                    showToast(`Treatment plan could not be saved: ${error.message || 'Unknown error'}`, 'error');
                } finally {
                    btn.disabled = false;
                }
            });

            document.querySelectorAll('.upload-trigger').forEach(el => {
                const openUploader = () => {
                    appState.activePhotoSlot = {
                        category: el.getAttribute('data-category'),
                        slot: el.getAttribute('data-slot')
                    };
                    appState.modalOpen = true;
                    appState.modalType = 'upload_photo';
                    render();
                };
                el.addEventListener('click', openUploader);
                el.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    openUploader();
                });
            });

            document.querySelectorAll('.delete-photo').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const cat = btn.getAttribute('data-category');
                    const slot = btn.getAttribute('data-slot');
                    const p = appState.patients.find(x => x.id === appState.selectedPatientId);
                    if (!p) return;
                    try {

        function attachModalListeners() {
            const closeModal = () => {
                appState.modalOpen = false;
                appState.modalType = null;
                appState.activePhotoSlot = null;
                render();
            };

            document.getElementById('modal-close')?.addEventListener('click', closeModal);
            document.getElementById('modal-cancel')?.addEventListener('click', closeModal);

            document.getElementById('add-patient-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const submit = e.currentTarget.querySelector('button[type="submit"]');
                submit.disabled = true;
                try {
                    const newPatient = await createPatientInCloud({
                        name: document.getElementById('new-name').value,
                        age: document.getElementById('new-age').value,
                        gender: document.getElementById('new-gender').value,
                        phone: document.getElementById('new-phone').value,
                        malocclusion: document.getElementById('new-malocclusion').value,
                        status: document.getElementById('new-status').value
                    });
                    appState.patients.unshift(newPatient);
                    appState.modalOpen = false;
                    appState.modalType = null;
                    showToast('Patient folder created successfully.');
                    render();
                } catch (error) {
                    console.error(error);
                    showToast(`Patient could not be created: ${error.message || 'Unknown error'}`, 'error');
                    submit.disabled = false;
                }
            });

            document.getElementById('upload-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const fileInput = document.getElementById('upload-file-input');
                const captionInput = document.getElementById('upload-caption');
                const submit = e.currentTarget.querySelector('button[type="submit"]');
                const file = fileInput?.files[0];
                const p = appState.patients.find(x => x.id === appState.selectedPatientId);
                const { category, slot } = appState.activePhotoSlot || {};
                if (!file || !p || !category || !slot) return;

                submit.disabled = true;
                const originalText = submit.textContent;
                submit.textContent = 'Uploading…';
                try {
                    await uploadClinicalRecord({
                        patient: p,
                        category,
                        slot,
                        stage: appState.activeStageTab,
                        file,
                        caption: captionInput?.value || 'Clinical Record'
                    });

                    // Explicitly close after a successful upload. This is the requested modal fix.
                    appState.modalOpen = false;
                    appState.modalType = null;
                    appState.activePhotoSlot = null;
                    showToast('Record uploaded successfully.');
                    render();
                } catch (error) {
                    console.error(error);
                    showToast(`Record upload failed: ${error.message || 'Unknown error'}`, 'error');
                    submit.disabled = false;
                    submit.textContent = originalText;
                }
            });
        }

        async function initializeApp() {
            if (!SUPABASE_CONFIGURED) {
                appState.booting = false;
                render();
                return;
            }

            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_OUT') {
                    appState.user = null;
                    appState.patients = [];
                    appState.doctorName = '';
                    appState.doctorEmail = '';
                    appState.currentView = 'login';
                    appState.booting = false;
                    render();
                } else if (event === 'SIGNED_IN' && session?.user) {
                    setTimeout(() => finishAuthentication(session.user), 0);
                }
            });

            try {
                const { data, error } = await supabaseClient.auth.getSession();
                if (error) throw error;
                if (data.session?.user) {
                    await finishAuthentication(data.session.user);
                } else {
                    appState.booting = false;
                    render();
                }
            } catch (error) {
                console.error(error);
                appState.booting = false;
                render();
                showToast(`Unable to initialize secure login: ${error.message || 'Unknown error'}`, 'error');
            }
        }

                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Status</label>
                                        <select id="new-status" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                            <option value="Active">Active Treatment</option>
                                            <option value="Retention">Retention</option>
                                            <option value="Completed">Completed</option>
                                        </select>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Malocclusion / Chief Complaint</label>
                                    <input type="text" id="new-malocclusion" required placeholder="e.g. Class II Division 1" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                </div>
                                <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                                    <button type="button" id="modal-cancel" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 cursor-pointer">Cancel</button>
                                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-emerald-600 text-white shadow-md cursor-pointer">Create Patient Folder</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            } else if (appState.modalType === 'upload_photo') {
                return `
                    <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
                        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
                            <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                                <h3 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-cloud-arrow-up text-emerald-400"></i> Upload Clinical Record</h3>
                                <button id="modal-close" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
                            </div>
                            <form id="upload-form" class="p-6 space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Caption / Notes</label>
                                    <input type="text" id="upload-caption" placeholder="e.g. Initial alignment progress" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Select Image File</label>
                                    <input type="file" id="upload-file-input" required accept="image/*" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                </div>
                                <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                                    <button type="button" id="modal-cancel" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 cursor-pointer">Cancel</button>
                                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-emerald-600 text-white shadow-md cursor-pointer">Upload & Save</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            }
            return '';
        }
    </script>
</body>
</html>
