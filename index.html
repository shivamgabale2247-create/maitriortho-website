                            placeholder="Enter treatment plan steps...">${p.treatmentPlan || ''}</textarea>
                        <div class="mt-4 flex justify-end">
                            ${isAdminViewingDoctor() ? `<span class="text-xs font-semibold text-slate-400"><i class="fa-solid fa-eye mr-1.5"></i> Read-only administrator view</span>` : `<button id="btn-save-plan" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl text-sm font-medium shadow-md transition-all flex items-center gap-2 cursor-pointer">
                                <i class="fa-solid fa-floppy-disk"></i>
                                <span>Save Treatment Plan</span>
                            </button>`}
                        </div>
                    </div>
                `;
            }
        }

        function renderModal() {
            if (appState.modalType === 'add_patient') {
                return `
                    <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
                        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden">
                            <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                                <h3 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-user-plus text-emerald-400"></i> Add New Patient</h3>
                                <button id="modal-close" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
                            </div>
                            <form id="add-patient-form" class="p-6 space-y-4">
                                <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-xs text-emerald-800 flex items-start gap-2">
                                    <i class="fa-solid fa-id-card mt-0.5"></i>
                                    <div><strong>Patient ID:</strong> A unique 5-digit ID will be generated automatically when you create this patient. Keep this ID for the future patient portal.</div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Patient Full Name</label>
                                    <input type="text" id="new-name" required placeholder="e.g. Sarah Connor" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Age</label>
                                        <input type="number" id="new-age" required min="3" max="99" value="15" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Gender</label>
                                        <select id="new-gender" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                            <option value="Female">Female</option>
                                            <option value="Male">Male</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Phone</label>
                                        <input type="text" id="new-phone" required placeholder="+1 (555) 000-0000" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Status</label>
                                        <select id="new-status" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                            <option value="Active">Active Treatment</option>
                                            <option value="Retention">Retention</option>
                                            <option value="Completed">Completed</option>
                                        </select>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Malocclusion / Chief Complaint</label>
                                    <input type="text" id="new-malocclusion" required placeholder="e.g. Class II Division 1" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                </div>
                                <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                                    <button type="button" id="modal-cancel" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 cursor-pointer">Cancel</button>
                                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-emerald-600 text-white shadow-md cursor-pointer">Create Patient Folder</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            } else if (appState.modalType === 'add_appointment') {
                const today = localDateISO();
                return `
                    <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
                        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden">
                            <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                                <h3 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-calendar-plus text-emerald-400"></i> New Appointment</h3>
                                <button id="modal-close" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
                            </div>
                            <form id="add-appointment-form" class="p-6 space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Patient</label>
                                    <select id="appointment-patient" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                        <option value="">Select patient…</option>
                                        ${(appState.patients || []).map(p => `<option value="${p.id}">${escapeHtml(p.name)}${p.patientCode ? ' — ID ' + escapeHtml(p.patientCode) : ''}${p.phone ? ' — ' + escapeHtml(p.phone) : ''}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Date</label>
                                        <input type="date" id="appointment-date" required value="${today}" min="${today}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Time</label>
                                        <input type="time" id="appointment-time" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Planned Work / Reason</label>
                                    <input type="text" id="appointment-planned-work" placeholder="e.g. Wire change / review / IPR" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Notes</label>
                                    <textarea id="appointment-notes" rows="3" placeholder="Optional appointment notes…" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                                </div>
                                <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                                    <button type="button" id="modal-cancel" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 cursor-pointer">Cancel</button>
                                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-emerald-600 text-white shadow-md cursor-pointer">Create Appointment</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            } else if (appState.modalType === 'reschedule_appointment') {
                const appointment = appState.appointments.find(a => a.id === appState.rescheduleAppointmentId);
                if (!appointment) return '';
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                const minDate = localDateISO(tomorrow);
                return `
                    <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
                        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden">
                            <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                                <div><h3 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-calendar-arrow-up text-emerald-400"></i> Reschedule Appointment</h3><p class="text-[11px] text-slate-400 mt-1">${escapeHtml(humanDate(appointment.appointmentDate))}${appointment.appointmentTime ? ` • ${escapeHtml(formatAppointmentTime(appointment.appointmentTime))}` : ''}</p></div>
                                <button id="modal-close" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
                            </div>
                            <form id="reschedule-appointment-form" class="p-6 space-y-4">
                                <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800"><i class="fa-solid fa-circle-info mr-1.5"></i>The original appointment remains in the history. It will be marked <strong>${appointment.status === 'no_show' ? 'No-show' : 'Rescheduled'}</strong> and a new appointment will be created.</div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">New Date</label>
                                        <input type="date" id="reschedule-date" required min="${minDate}" value="${minDate}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">New Time</label>
                                        <input type="time" id="reschedule-time" required value="${escapeHtml(appointment.appointmentTime || '17:00').slice(0,5)}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Reason / Note</label>
                                    <textarea id="reschedule-note" rows="3" placeholder="e.g. Patient requested a later date…" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                                </div>
                                <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                                    <button type="button" id="modal-cancel" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 cursor-pointer">Cancel</button>
                                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-emerald-600 text-white shadow-md cursor-pointer"><i class="fa-solid fa-calendar-check mr-1.5"></i>Save New Appointment</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            } else if (appState.modalType === 'upload_photo') {
                return `
                    <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
                        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
                            <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                                <h3 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-cloud-arrow-up text-emerald-400"></i> Upload Clinical Record</h3>
                                <button id="modal-close" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
                            </div>
                            <form id="upload-form" class="p-6 space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Caption / Notes</label>
                                    <input type="text" id="upload-caption" placeholder="e.g. Initial alignment progress" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Select Image File</label>
                                    <input type="file" id="upload-file-input" required accept="image/*" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                    <div class="mt-2 flex items-start gap-2 text-[11px] leading-4 text-slate-500">
                                        <i class="fa-solid fa-compress text-emerald-600 mt-0.5"></i>
                                        <span>Photos are automatically optimized in your browser before upload to reduce Supabase storage use. Clinical proportions are preserved; photographs are targeted around 2000 px and radiographs around 2400 px.</span>
                                    </div>
                                </div>
                                <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                                    <button type="button" id="modal-cancel" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 cursor-pointer">Cancel</button>
                                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-emerald-600 text-white shadow-md cursor-pointer">Upload & Save</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            }
            return '';
        }
    </script>
</body>
</html>
