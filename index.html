            document.getElementById('portal-patient-tab')?.addEventListener('click', () => {
                appState.portalMode = 'patient';
                appState.authMode = 'login';
                render();
            });

            const patientForm = document.getElementById('patient-login-form');
            patientForm?.addEventListener('submit', async e => {
                e.preventDefault();
                if (appState.patientPortalBusy) return;
                const code = document.getElementById('patient-portal-code')?.value.trim() || '';
                const phone = document.getElementById('patient-portal-phone')?.value.trim() || '';
                const submit = patientForm.querySelector('button[type="submit"]');
                appState.patientPortalBusy = true;
                if (submit) { submit.disabled = true; submit.classList.add('opacity-60'); submit.innerHTML = '<span>Verifying…</span><i class="fa-solid fa-spinner fa-spin"></i>'; }
                try {
                    await loginPatientPortal(code, phone);
                    showToast(`Welcome, ${appState.patientPortalPatient?.name || 'Patient'}.`);
                    render();
                } catch (error) {
                    console.error(error);
                    showToast(error.message || 'Patient verification failed.', 'error');
                    appState.patientPortalBusy = false;
                    if (submit) { submit.disabled = false; submit.classList.remove('opacity-60'); submit.innerHTML = '<span>Open Patient Portal</span><i class="fa-solid fa-arrow-right"></i>'; }
                }
            });

            const form = document.getElementById('login-form');
            document.getElementById('auth-mode-toggle')?.addEventListener('click', () => {
                appState.authMode = appState.authMode === 'login' ? 'signup' : 'login';
                render();
            });

            form?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('doctor-email')?.value.trim() || '';
                const password = document.getElementById('doctor-password')?.value || '';
                const name = document.getElementById('doctor-name')?.value.trim() || '';
                if (!email || !password || (appState.authMode === 'signup' && !name)) return;
                if (password.length < 8) {
                    showToast('Password must contain at least 8 characters.', 'error');
                    return;
                }

                setAuthBusy(true, appState.authMode === 'login' ? 'Signing in…' : 'Creating account…');
                try {
                    if (appState.authMode === 'login') {
                        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                        await finishAuthentication(data.user);
                    } else {
                        const { data, error } = await supabaseClient.auth.signUp({
                            email,
                            password,
                            options: {
                                data: { doctor_name: name },
                                emailRedirectTo: window.location.href
                            }
                        });
                        if (error) throw error;
                        if (data.session && data.user) {
                            await finishAuthentication(data.user);
                        } else {
                            showToast('Account created. Check your email to confirm the account, then sign in.', 'info');
                            appState.authMode = 'login';
                            render();
                        }
                    }
                } catch (error) {
                    console.error(error);
                    showToast(error.message || 'Authentication failed.', 'error');
                    setAuthBusy(false, appState.authMode === 'login' ? 'Access Doctor Portal' : 'Create Doctor Account');
                }
            });
        }

        async function loadTimelineForPatient(patientId) {
            const { data, error } = await supabaseClient
                .from('patient_timeline')
                .select('*')
                .eq('patient_id', patientId)
                .order('event_date', { ascending: false });
            if (error) throw error;
            const patient = appState.patients.find(x => x.id === patientId);
            if (!patient) return;
            patient.timeline = {};
            (data || []).forEach(row => {
                patient.timeline[row.event_date] = {
                    id: row.id,
                    eventDate: row.event_date,
                    appointmentId: row.appointment_id || '',
                    workDone: row.work_done || '',
                    createdAt: row.created_at || '',
                    updatedAt: row.updated_at || ''
                };
            });
        }

        function localDateISO(date = new Date()) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function humanDate(dateKey) {
            if (!dateKey) return '';
            const [y, m, d] = dateKey.split('-').map(Number);
            if (!y || !m || !d) return dateKey;
            return new Date(y, m - 1, d).toLocaleDateString(undefined, {
                day: '2-digit', month: 'long', year: 'numeric'
            });
        }

        function parseDateKey(dateKey) {
            const [y, m, d] = dateKey.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function setTimelineMonthTo(dateKey) {
            const d = parseDateKey(dateKey || localDateISO());
            appState.timelineYear = d.getFullYear();
            appState.timelineMonth = d.getMonth();
        }

        function buildTimelineCalendar(patient) {
            const year = appState.timelineYear;
            const month = appState.timelineMonth;
            const first = new Date(year, month, 1);
            const last = new Date(year, month + 1, 0);
            const daysInMonth = last.getDate();
            const mondayIndex = (first.getDay() + 6) % 7;
            const monthLabel = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
            const selected = appState.selectedTimelineDate || localDateISO();
            const today = localDateISO();
            const cells = [];

            for (let i = 0; i < mondayIndex; i++) {
                cells.push('<div class="h-12"></div>');
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const entry = patient.timeline?.[key];
                const isSelected = key === selected;
                const isToday = key === today;
                const isNext = key === patient.nextAppointmentDate;

                let cls = 'h-12 rounded-xl flex flex-col items-center justify-center text-sm font-semibold border transition-all cursor-pointer relative';
                if (isNext) {
                    cls += ' bg-rose-600 text-white border-rose-600 shadow-sm';
                } else if (isSelected) {
                    cls += ' bg-emerald-600 text-white border-emerald-600 shadow-sm';
                } else {
                    cls += ' bg-white text-slate-700 border-slate-200 hover:border-emerald-400 hover:bg-emerald-50';
                }
                if (isToday && !isNext && !isSelected) cls += ' ring-1 ring-slate-400';

                cells.push(`
                    <button type="button" class="timeline-date-btn ${cls}" data-date="${key}" title="${entry ? 'Work recorded' : 'Select date'}${isNext ? ' • Next appointment' : ''}">
                        <span>${day}</span>
                        ${entry ? `<span class="w-1.5 h-1.5 rounded-full ${isNext || isSelected ? 'bg-white' : 'bg-emerald-600'} mt-0.5"></span>` : '<span class="h-1.5 mt-0.5"></span>'}
                    </button>
                `);
            }

            while (cells.length % 7 !== 0) cells.push('<div class="h-12"></div>');

            return `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-xs p-5">
                    <div class="flex items-center justify-between mb-4">
                        <div>
                            <h3 class="font-bold text-slate-800 text-base">${monthLabel}</h3>
                            <p class="text-xs text-slate-500 mt-0.5">Green dots mark work recorded. Red marks the next appointment.</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button id="timeline-prev-month" type="button" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center cursor-pointer" title="Previous month"><i class="fa-solid fa-chevron-left"></i></button>
                            <button id="timeline-next-month" type="button" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center cursor-pointer" title="Next month"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-7 gap-2 mb-2">
                        ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div class="text-center text-[10px] font-bold uppercase tracking-wider text-slate-400">${d}</div>`).join('')}
                    </div>
                    <div class="grid grid-cols-7 gap-2">${cells.join('')}</div>
                </div>
            `;
        }

        async function saveTimelineEntryToCloud(patient, eventDate, workDone) {
            if (!patient?.id || isAdminViewingDoctor()) throw new Error('Administrator view is read-only.');
            if (!eventDate) throw new Error('Please choose a visit date.');
            if (eventDate > localDateISO()) throw new Error('Work done can only be recorded for today or a previous date.');
            const trimmedWork = String(workDone || '').trim();
            if (!trimmedWork) throw new Error('Please enter the work done before saving.');

            const appointment = await ensureVisitAppointmentForPatientDate(patient, eventDate, {
                status: 'completed',
                workDone: trimmedWork,
                notes: 'Visit created/updated from Work Done timeline.'
            });

            const payload = {
                owner_id: patient.ownerId || appState.user.id,
                patient_id: patient.id,
                event_date: eventDate,
                appointment_id: appointment.id,
                work_done: trimmedWork
            };
            const { data, error } = await supabaseClient
                .from('patient_timeline')
                .upsert(payload, { onConflict: 'patient_id,event_date' })
                .select('*')
                .single();
            if (error) throw error;
            patient.timeline[eventDate] = {
                id: data.id,
                eventDate: data.event_date,
                appointmentId: data.appointment_id || appointment.id,
                workDone: data.work_done || '',
                createdAt: data.created_at || '',
                updatedAt: data.updated_at || ''
            };

            if (eventDate <= localDateISO()) {
                const { error: visitError } = await supabaseClient
                    .from('patients')
                    .update({ last_visit: eventDate, updated_at: new Date().toISOString() })
                    .eq('id', patient.id);
                if (visitError) console.warn('Last visit sync warning:', visitError.message);
                patient.lastVisit = eventDate;
            }
            await syncNextAppointmentDateForPatient(patient.id);
        }

        async function saveNextAppointmentToCloud(patient, date, time = '') {
            if (!patient?.id || isAdminViewingDoctor()) throw new Error('Administrator view is read-only.');
            if (date && date < localDateISO()) throw new Error('Next appointment date cannot be in the past.');

            if (date) {
                await ensureNextAppointmentRecord(patient, date, time);
            }

            const { data, error } = await supabaseClient
                .from('patients')
                .update({ next_appointment_date: date || null, updated_at: new Date().toISOString() })
                .eq('id', patient.id)
                .select('next_appointment_date')
                .single();
            if (error) throw error;
            patient.nextAppointmentDate = data.next_appointment_date || '';
            if (!date) return;

            // Refresh the owner's appointment list so the main scheduler and patient view stay identical.
            await loadAppointmentsForOwner(patient.ownerId || appState.user.id);
        }

        async function savePatientPaymentForDate(patient, date, rawAmount) {
            if (!patient?.id || isAdminViewingDoctor()) throw new Error('Administrator view is read-only.');
            if (!date) throw new Error('Please choose a payment date.');
            if (date > localDateISO()) throw new Error('Payment can only be recorded for today or a previous date.');
            const amountText = String(rawAmount ?? '').trim();
            const amount = amountText === '' ? 0 : Number(amountText);
            if (!Number.isFinite(amount) || amount < 0) throw new Error('Please enter a valid payment amount in rupees.');

            let appointment = getPatientAppointmentsForDate(patient.id, date)[0] || null;
            if (!appointment && amount > 0) {
                appointment = await ensureVisitAppointmentForPatientDate(patient, date, {
                    status: 'completed',
                    workDone: patient.timeline?.[date]?.workDone || '',
                    notes: 'Visit created from patient payment entry.'
                });
            }
            if (!appointment) {
                throw new Error('There is no visit/appointment on this date to attach this payment to.');
            }

            await savePaymentInCloud(appointment, amount);
            await loadPaymentsForPatient(patient.id);
            await loadAppointmentsForOwner(patient.ownerId || appState.user.id);
            await syncNextAppointmentDateForPatient(patient.id);
        }


        function clearPatientPortalSession() {
            appState.patientPortalSessionToken = '';
            appState.patientPortalPatient = null;
            appState.patientPortalAppointments = [];
            appState.patientPortalBusy = false;
        }

        function patientPortalRpcRecord(data) {
            if (Array.isArray(data)) return data[0] || null;
            return data || null;
        }

        function normalizePatientMobile(phone) {
            const digits = String(phone || '').replace(/\D/g, '');
            // MaitriOrtho stores Indian mobile numbers as 10 digits.
            // Accept common +91 / 91 formats from the patient-facing form.
            return digits.length >= 10 ? digits.slice(-10) : digits;
        }

        function withTimeout(promise, ms, message) {
            return Promise.race([
                promise,
                new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms))
            ]);
        }

        async function loginPatientPortal(patientCode, phone) {
            const code = String(patientCode || '').trim();
            const mobile = normalizePatientMobile(phone);
            if (!/^\d{5}$/.test(code)) throw new Error('Enter the 5-digit Patient ID.');
            if (!/^\d{10}$/.test(mobile)) throw new Error('Enter a valid 10-digit registered mobile number.');

            const { data, error } = await withTimeout(
                supabaseClient.rpc('maitri_patient_portal_login', {
                    p_patient_code: code,
                    p_phone: mobile
                }),
                12000,
                'Patient portal verification timed out. Please try again.'
            );
            if (error) throw error;
            const record = patientPortalRpcRecord(data);
            if (!record?.session_token || !record?.patient_id) {
                throw new Error(record?.message || 'Patient ID or registered mobile number could not be verified.');
            }

            appState.patientPortalSessionToken = record.session_token;
            appState.patientPortalPatient = {
                id: record.patient_id,
                name: record.patient_name || 'Patient',
                patientCode: record.patient_code || code,
                doctorId: record.doctor_id || '',
                doctorName: record.doctor_name || 'Your Orthodontist',
                nextAppointmentDate: record.next_appointment_date || ''
            };
            // Show the portal as soon as identity verification succeeds.
            // Appointment loading is secondary and must not leave the login button
            // spinning forever.
            appState.currentView = 'patient_portal';
            appState.patientPortalBusy = false;
            try {
                await withTimeout(
                    loadPatientPortalAppointments(),
                    10000,
                    'Appointments could not be loaded right now.'
                );
            } catch (error) {
                console.error('Patient portal appointments load failed:', error);
                appState.patientPortalAppointments = [];
                showToast(error.message || 'Appointments could not be loaded right now.', 'error');
            }
        }

        async function loadPatientPortalAppointments() {
            if (!appState.patientPortalSessionToken) return [];
            const { data, error } = await supabaseClient.rpc('maitri_patient_portal_get_appointments', {
                p_session_token: appState.patientPortalSessionToken
            });
            if (error) throw error;
            appState.patientPortalAppointments = (data || []).map(mapAppointmentRow);
            return appState.patientPortalAppointments;
        }

        async function requestPatientPortalAppointment(date, time, reason) {
            if (!appState.patientPortalSessionToken) throw new Error('Patient portal session expired. Please sign in again.');
            if (!date || !time) throw new Error('Please choose an appointment date and time.');
            if (date < localDateISO()) throw new Error('Appointment date cannot be in the past.');
            const { data, error } = await supabaseClient.rpc('maitri_patient_portal_request_appointment', {
                p_session_token: appState.patientPortalSessionToken,
                p_date: date,
                p_time: time,
                p_reason: String(reason || '').trim()
            });
            if (error) throw error;
            const record = patientPortalRpcRecord(data);
            if (!record?.id) throw new Error(record?.message || 'Appointment request could not be created.');
            await loadPatientPortalAppointments();
            return mapAppointmentRow(record);
        }

        async function deletePatientFromCloud(patientId) {
            const { data: records, error: recordError } = await supabaseClient
                .from('clinical_records')
                .select('storage_path')
                .eq('patient_id', patientId);
            if (recordError) throw recordError;

            const paths = (records || []).map(r => r.storage_path).filter(Boolean);
            if (paths.length) {
                const { error: storageError } = await supabaseClient.storage
                    .from(SUPABASE_BUCKET)
                    .remove(paths);
                if (storageError) console.warn('Some clinical files could not be removed:', storageError.message);

        async function createPatientInCloud(form) {
            if (!appState.user?.id || isAdminViewingDoctor()) throw new Error('Administrator view is read-only.');

            // Generate the ID here so the doctor does not need to type it manually.
            // The final SQL will add a UNIQUE constraint; if two doctors happen to
            // generate the same 5-digit code at the same moment, we retry safely.
            for (let attempt = 1; attempt <= 12; attempt++) {
                const patientCode = generatePatientCode();
                const payload = {
                    owner_id: appState.user.id,
                    patient_code: patientCode,
                    name: form.name.trim(),
                    age: Number.parseInt(form.age, 10),
                    gender: form.gender,
                    phone: form.phone.trim(),
                    malocclusion: form.malocclusion.trim(),
                    start_date: todayISO(),
                    status: form.status,
                    last_visit: todayISO(),
                    treatment_plan: 'Initial orthodontic records taken.'
                };
                const { data, error } = await supabaseClient
                    .from('patients')
                    .insert(payload)
                    .select('*')
                    .single();
                if (!error) return mapPatientRow(data);

                // PostgreSQL unique-violation; try a different ID.
                if (error.code === '23505' && /patient.?code/i.test(`${error.message || ''} ${error.details || ''} ${error.hint || ''}`)) {
                    continue;
                }
                throw error;
            }
            throw new Error('Could not generate a unique 5-digit Patient ID. Please try again.');
        }

        function getFileExtension(file) {
            const name = file.name || '';
            const dot = name.lastIndexOf('.');
            if (dot >= 0) return name.slice(dot).toLowerCase().replace(/[^a-z0-9.]/g, '');
            const type = (file.type || '').toLowerCase();
            return type === 'image/png' ? '.png' : type === 'image/webp' ? '.webp' : '.jpg';
        }

        function formatFileSize(bytes) {
            if (!Number.isFinite(bytes) || bytes < 0) return '0 B';
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
        }

        function compressionProfile(category) {
            // Photographic records can be compressed more aggressively while
            // cephalograms/OPGs retain a little more resolution and quality.
            const radiographic = category === 'cephalogram' || category === 'opg';
            return radiographic
                ? { maxDimension: 2400, quality: 0.90, targetBytes: 2.5 * 1024 * 1024 }
                : { maxDimension: 2000, quality: 0.84, targetBytes: 900 * 1024 };
        }

        function loadImageForCompression(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('The selected image could not be read.')); };
                img.src = url;
            });
        }

        function canvasToJpegBlob(canvas, quality) {
            return new Promise((resolve, reject) => {
                canvas.toBlob(blob => {
                    if (blob) resolve(blob);
                    else reject(new Error('Browser image optimization failed.'));
                }, 'image/jpeg', quality);
            });
        }

        async function optimizeClinicalImage(file, category) {
            if (!file) throw new Error('Please select an image file.');
            if (!file.type?.startsWith('image/')) throw new Error('Only image files are accepted.');
            if (file.size > MAX_UPLOAD_BYTES) throw new Error('Please choose an image smaller than 10 MB.');

            // Very small vector files are left alone; raster clinical records are optimized.
            if (file.type === 'image/svg+xml') return { file, originalSize: file.size, optimizedSize: file.size, compressed: false };

            const profile = compressionProfile(category);
            let image;
            try {
                image = await loadImageForCompression(file);
            } catch (error) {
                console.warn('Image optimization skipped:', error.message);
                return { file, originalSize: file.size, optimizedSize: file.size, compressed: false };
            }

            const sourceWidth = image.naturalWidth || image.width;
            const sourceHeight = image.naturalHeight || image.height;
            if (!sourceWidth || !sourceHeight) {
                return { file, originalSize: file.size, optimizedSize: file.size, compressed: false };
            }

            const scale = Math.min(1, profile.maxDimension / Math.max(sourceWidth, sourceHeight));
            const width = Math.max(1, Math.round(sourceWidth * scale));
            const height = Math.max(1, Math.round(sourceHeight * scale));

            // Do not create an unnecessarily larger file when the uploaded image is already compact.
            if (scale === 1 && file.size <= profile.targetBytes && file.type === 'image/jpeg') {
                return { file, originalSize: file.size, optimizedSize: file.size, compressed: false };
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d', { alpha: false });
            if (!ctx) throw new Error('Browser image canvas is unavailable.');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(image, 0, 0, width, height);

            let blob = await canvasToJpegBlob(canvas, profile.quality);

            // Reduce quality only when the first pass is still larger than the practical target.
            if (blob.size > profile.targetBytes) {
                for (const quality of [0.78, 0.70, 0.64]) {
                    const candidate = await canvasToJpegBlob(canvas, quality);
                    blob = candidate;
                    if (blob.size <= profile.targetBytes) break;
                }
            }

            // Keep the original if optimization does not actually save space.
            if (blob.size >= file.size) {
                return { file, originalSize: file.size, optimizedSize: file.size, compressed: false };
            }

            const safeBaseName = (file.name || 'clinical-record').replace(/\.[^.]+$/, '');
            const optimizedFile = new File([blob], `${safeBaseName}.jpg`, {
                type: 'image/jpeg',
                lastModified: Date.now()
            });

            return {
                file: optimizedFile,
                originalSize: file.size,
                optimizedSize: optimizedFile.size,
                compressed: true
            };
        }

        async function uploadClinicalRecord({ patient, category, slot, stage, file, caption }) {
            if (!file) throw new Error('Please select an image file.');
            if (!file.type?.startsWith('image/')) throw new Error('Only image files are accepted.');
            if (file.size > MAX_UPLOAD_BYTES) throw new Error('Please choose an image smaller than 10 MB.');

            const existing = patient.stages?.[stage]?.[category]?.[slot] || {};
            const optimized = await optimizeClinicalImage(file, category);
            const uploadFile = optimized.file;
            const extension = optimized.compressed ? '.jpg' : getFileExtension(uploadFile);
            const path = `${appState.user.id}/${patient.id}/${stage}/${category}/${slot}-${crypto.randomUUID()}${extension}`;

            const { error: uploadError } = await supabaseClient.storage
                .from(SUPABASE_BUCKET)
                .upload(path, uploadFile, {
                    cacheControl: '3600',
                    contentType: uploadFile.type,
                    upsert: false
                });
            if (uploadError) throw uploadError;

            const { data: row, error: dbError } = await supabaseClient
                .from('clinical_records')
                .upsert({
                    owner_id: appState.user.id,
                    patient_id: patient.id,
                    stage,
                    category,
                    slot,
                    storage_path: path,
                    caption: caption || 'Clinical Record',
                    original_filename: file.name || '',
                    content_type: uploadFile.type || '',
                    size_bytes: uploadFile.size
                }, { onConflict: 'patient_id,stage,category,slot' })
                .select('*')
                .single();

            if (dbError) {
                await supabaseClient.storage.from(SUPABASE_BUCKET).remove([path]);
                throw dbError;
            }

            if (existing.storagePath && existing.storagePath !== path) {
                const { error: oldRemoveError } = await supabaseClient.storage.from(SUPABASE_BUCKET).remove([existing.storagePath]);
                if (oldRemoveError) console.warn('Old file could not be removed:', oldRemoveError.message);
            }

            const signedUrl = await signedUrlFor(path);
            setRecordInPatient(patient, row, signedUrl);
            return optimized;
        }

        async function deleteClinicalRecord(patient, category, slot, stage) {
            const record = patient.stages?.[stage]?.[category]?.[slot] || {};
            if (!record.recordId && !record.storagePath) return;

            if (record.storagePath) {
                const { error: storageError } = await supabaseClient.storage.from(SUPABASE_BUCKET).remove([record.storagePath]);
                if (storageError) console.warn('File removal warning:', storageError.message);
            }

            if (record.recordId) {
                const { error } = await supabaseClient.from('clinical_records').delete().eq('id', record.recordId);
                if (error) throw error;
            } else {
                const { error } = await supabaseClient
                    .from('clinical_records')
                    .delete()
                    .eq('patient_id', patient.id)
                    .eq('stage', stage)
                    .eq('category', category)
                    .eq('slot', slot);
                if (error) throw error;
            }

            patient.stages[stage][category][slot] = {};
        }

                    appState.modalOpen = false;
                    appState.modalType = null;
                    appState.rescheduleAppointmentId = null;
                    showToast('Appointment rescheduled successfully.');
                    render();
                } catch (error) {
                    console.error(error);
                    showToast(`Appointment could not be rescheduled: ${error.message || 'Unknown error'}`, 'error');
                    submit.disabled = false;
                    submit.innerHTML = oldText;
                }
            });

            document.getElementById('upload-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const fileInput = document.getElementById('upload-file-input');
                const captionInput = document.getElementById('upload-caption');
                const submit = e.currentTarget.querySelector('button[type="submit"]');
                const file = fileInput?.files[0];
                const p = appState.patients.find(x => x.id === appState.selectedPatientId);
                const { category, slot } = appState.activePhotoSlot || {};
                if (!file || !p || !category || !slot) return;

                submit.disabled = true;
                const originalText = submit.textContent;
                submit.textContent = 'Uploading…';
                try {
                    const uploadResult = await uploadClinicalRecord({
                        patient: p,
                        category,
                        slot,
                        stage: appState.activeStageTab,
                        file,
                        caption: captionInput?.value || 'Clinical Record'
                    });

                    // Explicitly close after a successful upload. This is the requested modal fix.
                    appState.modalOpen = false;
                    appState.modalType = null;
                    appState.activePhotoSlot = null;
                    const savedMessage = uploadResult.compressed
                        ? `Record uploaded and optimized: ${formatFileSize(uploadResult.originalSize)} → ${formatFileSize(uploadResult.optimizedSize)}.`
                        : 'Record uploaded successfully.';
                    showToast(savedMessage);
                    render();
                } catch (error) {
                    console.error(error);
                    showToast(`Record upload failed: ${error.message || 'Unknown error'}`, 'error');
                    submit.disabled = false;
                    submit.textContent = originalText;
                }
            });
        }

        async function initializeApp() {
            if (!SUPABASE_CONFIGURED) {
                appState.booting = false;
                render();
                return;
            }

            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_OUT') {
                    clearPatientPortalSession();
                    appState.user = null;
                    appState.patients = [];
                    appState.doctorName = '';
                    appState.doctorEmail = '';
                    appState.currentView = 'login';
                    appState.booting = false;
                    render();
                } else if (event === 'SIGNED_IN' && session?.user) {
                    setTimeout(() => finishAuthentication(session.user), 0);
                }
            });

            try {
                const { data, error } = await supabaseClient.auth.getSession();
                if (error) throw error;
                if (data.session?.user) {
                    await finishAuthentication(data.session.user);
                } else {
                    appState.booting = false;
                    render();
                }
            } catch (error) {
                console.error(error);
                appState.booting = false;
                render();
                showToast(`Unable to initialize secure login: ${error.message || 'Unknown error'}`, 'error');
            }
        }

        async function openDoctorAsAdmin(doctorId, doctorName, doctorEmail) {
            appState.viewingDoctorId = doctorId;
            appState.viewingDoctorName = doctorName || 'Doctor';
            appState.viewingDoctorEmail = doctorEmail || '';
            appState.searchQuery = '';
            appState.statusFilter = 'all';
            appState.payments = [];
            appState.booting = true;
            render();
            try {
                appState.patients = await loadCloudPatients(doctorId);
                appState.currentView = 'dashboard';
            } catch (error) {
                console.error(error);
                showToast(`Unable to load doctor's patients: ${error.message || 'Unknown error'}`, 'error');
                appState.patients = [];
                appState.currentView = 'admin_dashboard';
            } finally {
                appState.booting = false;
                render();
            }
        }

            document.getElementById('btn-admin-logout')?.addEventListener('click', async () => {

                    appState.doctorName = '';
                    appState.doctorEmail = '';
                    appState.role = 'doctor';
                    appState.currentView = 'login';
                    appState.selectedPatientId = null;
                    appState.patients = [];
                    appState.doctors = [];
                    appState.user = null;
                    appState.rescheduleAppointmentId = null;
                    appState.authMode = 'login';
                    render();
                }
            });

            document.querySelectorAll('.open-doctor').forEach(el => {
                el.addEventListener('click', () => {
                    openDoctorAsAdmin(
                        el.getAttribute('data-id'),
                        el.getAttribute('data-name') || 'Doctor',
                        el.getAttribute('data-email') || ''
                    );
                });
            });
        }

        function caseSheetValue(store, key) { return (store && store[key]?.value) ?? ''; }
        function caseSheetInference(store, key) { return (store && store[key]?.inference) ?? ''; }
        function caseSheetRemark(store, key) { return (store && store[key]?.remark) ?? ''; }
        function escCase(value) { return escapeHtml(value == null ? '' : String(value)); }
        function caseFieldControl(key, label, type, store) {
            const value = caseSheetValue(store, key);
            if (type.startsWith('select:')) {
                const opts = type.slice(7).split('|');
                return `<select data-cs-value="${escCase(key)}" class="w-full border-0 outline-none text-sm"><option value=""></option>${opts.map(o=>`<option ${value===o?'selected':''}>${escCase(o)}</option>`).join('')}</select>`;
            }
            if (type === 'textarea') return `<textarea data-cs-value="${escCase(key)}" rows="2" class="w-full border-0 outline-none text-sm resize-y" placeholder="">${escCase(value)}</textarea>`;
            return `<input data-cs-value="${escCase(key)}" type="${type === 'currency' ? 'number' : type}" value="${escCase(value)}" class="w-full border-0 outline-none text-sm ${type==='currency'?'text-right':''}" ${type==='currency'?'min="0" step="1"':''}>`;
        }
        function inferenceSelect(key, group, store) {
            const opts = INFERENCE_OPTIONS[group] || INFERENCE_OPTIONS.neutral;
            const current = caseSheetInference(store,key);
            return `<select data-cs-inference="${escCase(key)}" class="w-full border border-slate-300 rounded px-2 py-1.5 text-xs"><option value="">Select inference ▼</option>${opts.map(o=>`<option value="${escCase(o)}" ${current===o?'selected':''}>${escCase(o)}</option>`).join('')}</select>`;
        }
        function renderCaseRowsTable(rows, store, group='neutral') {
            return `<div class="overflow-x-auto"><table class="case-sheet-table min-w-[780px]"><thead><tr><th class="w-[42%]">FIELD</th><th>VALUE</th></tr></thead><tbody>${rows.map(([key,label,type])=>`<tr><td class="font-semibold">${escCase(label)}</td><td>${caseFieldControl(key,label,type,store)}</td></tr>`).join('')}</tbody></table></div>`;
        }
        function sectionRemarks(key, store) { return `<div class="mt-2"><div class="text-[11px] font-semibold uppercase tracking-wide text-slate-500">Remarks / If any</div><textarea data-cs-remark="${escCase(key)}" class="w-full border border-slate-300 rounded px-2 py-1.5 text-sm mt-1" rows="2">${escCase(caseSheetRemark(store,key))}</textarea></div>`; }

        function renderCaseHistorySheet(patient) {
            const store = patient.caseSheets?.case_history || {};
            const personal = CASE_HISTORY_SECTIONS[0];
            return `<div class="case-sheet-print-root case-sheet-paper p-4 space-y-4">
                <div class="case-sheet-no-print flex items-center justify-between gap-3"><div><h2 class="text-lg font-bold text-slate-900">PATIENT RECORD</h2><p class="text-xs text-slate-500">Case history and clinical examination — original sequence preserved.</p></div>${caseSheetActions()}</div>
                <section><div class="case-sheet-section-title">CONSENT FORM</div><div class="border border-black p-4 text-sm leading-6">I have been explained about the possibilities and limitation of treatment and side effect including demineralization of enamel (discolorations) and limitation of gums. I have also been briefed about the Duration, Maintenance of appliance, keeping of Appointments and the Financial Commitments pertaining to the treatment. I agree with the above treatment plan and give my full consent for the Treatment Procedure as deemed Necessary.</div><table class="case-sheet-table mt-2"><tbody><tr><td class="font-semibold w-1/3">Patient Name</td><td><input data-cs-value="consent_patient_name" value="${escCase(caseSheetValue(store,'consent_patient_name') || patient.name || '')}" class="w-full border-0 outline-none"></td></tr><tr><td class="font-semibold">Age</td><td><input data-cs-value="consent_age" value="${escCase(caseSheetValue(store,'consent_age') || patient.age || '')}" class="w-full border-0 outline-none"></td></tr><tr><td class="font-semibold">Name & Signature (Parent /Guardian)</td><td><input data-cs-value="consent_signature" value="${escCase(caseSheetValue(store,'consent_signature'))}" class="w-full border-0 outline-none"></td></tr><tr><td class="font-semibold">Date</td><td><input data-cs-value="consent_date" type="date" value="${escCase(caseSheetValue(store,'consent_date'))}" class="w-full border-0 outline-none"></td></tr></tbody></table></section>
                <section><div class="case-sheet-section-title">I. CASE HISTORY RECORD — A. PERSONAL DETAILS</div><table class="case-sheet-table"><tbody>${(personal.rows||[]).map(([k,l,type])=>`<tr><td class="font-semibold w-1/3">${escCase(l)}</td><td>${caseFieldControl(k,l,type,store)}</td></tr>`).join('')}</tbody></table></section>
                ${CASE_HISTORY_SECTIONS.slice(1).map((sec, idx)=>{
                    if(sec.family) return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div><table class="case-sheet-table"><thead><tr><th></th><th>FATHER</th><th>MOTHER</th><th>SIBLINGS</th><th>IF ANY / REMARKS</th></tr></thead><tbody><tr><td class="font-semibold">Malocclusion</td>${['father','mother','siblings'].map(x=>`<td><select data-cs-value="family_malocclusion_${x}" class="w-full border-0 outline-none text-sm"><option value=""></option><option ${caseSheetValue(store,'family_malocclusion_'+x)==='Yes'?'selected':''}>Yes</option><option ${caseSheetValue(store,'family_malocclusion_'+x)==='No'?'selected':''}>No</option></select></td>`).join('')}<td rowspan="2"><textarea data-cs-remark="family_remarks" class="w-full border-0 outline-none text-sm" rows="4">${escCase(caseSheetRemark(store,'family_remarks'))}</textarea></td></tr><tr><td class="font-semibold">Familial diseases</td>${['father','mother','siblings'].map(x=>`<td><select data-cs-value="family_disease_${x}" class="w-full border-0 outline-none text-sm"><option value=""></option><option ${caseSheetValue(store,'family_disease_'+x)==='Yes'?'selected':''}>Yes</option><option ${caseSheetValue(store,'family_disease_'+x)==='No'?'selected':''}>No</option></select></td>`).join('')}</tr></tbody></table></section>`;
                    if(sec.habits) return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div><table class="case-sheet-table"><tbody>${[['habit_none','None'],['habit_thumb','Finger Thumb Sucking'],['habit_lip','Lip biting'],['habit_tongue','Tongue thrusting'],['habit_nail','Nail Biting'],['habit_bruxism','Bruxism']].map(([k,l])=>`<tr><td class="font-semibold w-2/3">${escCase(l)}</td><td class="text-center"><input data-cs-value="${k}" type="checkbox" ${caseSheetValue(store,k)==='true'?'checked':''}></td></tr>`).join('')}<tr><td class="font-semibold">Other (specify)</td><td>${caseFieldControl('habit_other','Other','textarea',store)}</td></tr></tbody></table></section>`;
                    const showRemarks = sec.title==='E. DENTAL HISTORY' || sec.title==='F. MEDICAL HISTORY';
                    return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div>${renderCaseRowsTable(sec.rows,store)}${showRemarks?sectionRemarks('remarks_'+idx,store):''}</section>`;
                }).join('')}
            </div>`;
        }

        function caseSheetActions(){ return `<div class="flex gap-2"><button id="case-sheet-save" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-semibold cursor-pointer"><i class="fa-solid fa-floppy-disk mr-1.5"></i>Save</button><button id="case-sheet-print" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-semibold cursor-pointer"><i class="fa-solid fa-print mr-1.5"></i>Print</button><button id="case-sheet-clear" class="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-sm font-semibold cursor-pointer"><i class="fa-solid fa-eraser mr-1.5"></i>Clear</button></div>`; }

        function modelValue(store,key){ return caseSheetValue(store,key); }
        function renderInferenceCell(key, group, store){ return `<td>${inferenceSelect(key,group,store)}</td>`; }
        function renderModelAnalysisSheet(patient){
            const store = patient.caseSheets?.model_analysis || {};
            return `<div class="case-sheet-print-root case-sheet-paper p-4 space-y-5">
                <div class="flex items-center justify-between gap-3 case-sheet-no-print"><div><h2 class="text-lg font-bold text-slate-900">III. MODEL ANALYSIS</h2><p class="text-xs text-slate-500">Patient readings are entered manually. Inference is selected by the doctor.</p></div>${caseSheetActions()}</div>
                ${MODEL_ANALYSIS_SECTIONS.map((sec,idx)=>renderModelSection(sec,store,idx)).join('')}
            </div>`;
        }
        function renderModelSection(sec,store,idx){
            if(sec.type==='table') return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div><table class="case-sheet-table"><thead><tr><th>RELATION</th><th>RIGHT</th><th>LEFT</th></tr></thead><tbody>${sec.rows.map(([k,l])=>`<tr><td class="font-semibold">${l}</td><td><input data-cs-value="${k}_r" value="${escCase(modelValue(store,k+'_r'))}" class="w-full border-0 outline-none"></td><td><input data-cs-value="${k}_l" value="${escCase(modelValue(store,k+'_l'))}" class="w-full border-0 outline-none"></td></tr>`).join('')}</tbody></table>${sec.footRows.map(([k,l,u,g])=>`<table class="case-sheet-table mt-2"><tbody><tr><td class="font-semibold w-2/5">${escCase(l)}</td><td><input data-cs-value="${k}" value="${escCase(modelValue(store,k))}" class="w-full border-0 outline-none" placeholder="${escCase(u)}"></td></tr><tr><td class="font-semibold">Inference</td><td>${inferenceSelect(k,g,store)}</td></tr></tbody></table>`).join('')}${sectionRemarks('model_remarks_'+idx,store)}</section>`;
            if(sec.type==='toothwidth' || sec.type==='toothwidth_md') { const prefix=sec.type==='toothwidth'?'mx':'md'; return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div><table class="case-sheet-table"><thead><tr><th>TOOTH NUMBER</th><th>RIGHT</th><th>LEFT</th></tr></thead><tbody>${sec.rows.map(([n])=>`<tr><td>${n}</td><td><input data-cs-value="${prefix}_tooth_${n}_r" value="${escCase(modelValue(store,prefix+'_tooth_'+n+'_r'))}" class="w-full border-0 outline-none"></td><td><input data-cs-value="${prefix}_tooth_${n}_l" value="${escCase(modelValue(store,prefix+'_tooth_'+n+'_l'))}" class="w-full border-0 outline-none"></td></tr>`).join('')}</tbody></table></section>`; }
            if(sec.type==='metrics') return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div><table class="case-sheet-table"><thead><tr><th>PARAMETER</th><th>PATIENT’S VALUE</th><th>NORMAL VALUE</th><th>DIFFERENCE</th></tr></thead><tbody>${sec.rows.map(([k,l,ref,g])=>`<tr><td class="font-semibold">${escCase(l)}</td><td><input data-cs-value="${k}" value="${escCase(modelValue(store,k))}" class="w-full border-0 outline-none"></td><td>${escCase(ref)}</td><td><input data-cs-value="${k}_difference" value="${escCase(modelValue(store,k+'_difference'))}" class="w-full border-0 outline-none"></td></tr><tr><td class="font-semibold">Inference</td><td colspan="3">${inferenceSelect(k,g,store)}</td></tr>`).join('')}</tbody></table>${sectionRemarks('model_remarks_'+idx,store)}</section>`;
            if(sec.type==='metrics2') return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div><table class="case-sheet-table"><thead><tr><th>REGION</th><th>RIGHT</th><th>LEFT</th><th>DIFFERENCE</th></tr></thead><tbody>${sec.rows.map(([k,l])=>`<tr><td class="font-semibold">${escCase(l)}</td><td><input data-cs-value="${k}_r" value="${escCase(modelValue(store,k+'_r'))}" class="w-full border-0 outline-none"></td><td><input data-cs-value="${k}_l" value="${escCase(modelValue(store,k+'_l'))}" class="w-full border-0 outline-none"></td><td><input data-cs-value="${k}_difference" value="${escCase(modelValue(store,k+'_difference'))}" class="w-full border-0 outline-none"></td></tr><tr><td class="font-semibold">Inference</td><td colspan="3">${inferenceSelect(k,'symmetry',store)}</td></tr>`).join('')}</tbody></table>${sectionRemarks('model_remarks_'+idx,store)}</section>`;
            if(sec.type==='archindex') return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div><table class="case-sheet-table"><thead><tr><th>REGION / INDEX</th><th>ACTUAL</th><th>CALCULATED VALUE (CV)</th><th>DIFFERENCE</th></tr></thead><tbody>${sec.rows.map(([k,l,ref,g])=>`<tr><td class="font-semibold">${escCase(l)}</td><td><input data-cs-value="${k}" value="${escCase(modelValue(store,k))}" class="w-full border-0 outline-none"></td><td>${escCase(ref)}</td><td><input data-cs-value="${k}_difference" value="${escCase(modelValue(store,k+'_difference'))}" class="w-full border-0 outline-none"></td></tr><tr><td class="font-semibold">Inference</td><td colspan="3">${inferenceSelect(k,g,store)}</td></tr>`).join('')}</tbody></table>${sectionRemarks('model_remarks_'+idx,store)}</section>`;
            if(sec.type==='indexRows') return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div><table class="case-sheet-table"><thead><tr><th>PARAMETER</th><th>PATIENT / ACTUAL</th><th>CALCULATED / REFERENCE</th><th>DIFFERENCE</th></tr></thead><tbody>${sec.rows.map(([k,l,ref,g])=>`<tr><td class="font-semibold">${escCase(l)}</td><td><input data-cs-value="${k}" value="${escCase(modelValue(store,k))}" class="w-full border-0 outline-none"></td><td>${escCase(ref)}</td><td><input data-cs-value="${k}_difference" value="${escCase(modelValue(store,k+'_difference'))}" class="w-full border-0 outline-none"></td></tr><tr><td class="font-semibold">Inference</td><td colspan="3">${inferenceSelect(k,g,store)}</td></tr>`).join('')}</tbody></table>${sectionRemarks('model_remarks_'+idx,store)}</section>`;
            if(sec.type==='spaceTable') return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div><table class="case-sheet-table"><thead><tr><th>NO.</th><th>SPACE REQUIRED IN ARCH</th><th>IN MM</th></tr></thead><tbody>${sec.rows.map(([k,l],i)=>`<tr><td>${i+1}</td><td class="font-semibold">${escCase(l)}</td><td><input data-cs-value="${k}" value="${escCase(modelValue(store,k))}" class="w-full border-0 outline-none"></td></tr>`).join('')}<tr><td></td><td class="font-semibold">Inference</td><td>${inferenceSelect('space_inf_'+idx,'space',store)}</td></tr></tbody></table><div class="mt-3"><div class="case-sheet-section-title">SPACE AVAILABLE</div><table class="case-sheet-table"><thead><tr><th>NO.</th><th>SPACE AVAILABLE IN ARCH</th><th>IN MM</th></tr></thead><tbody>${(sec.available||[]).map(([k,l],i)=>`<tr><td>${i+1}</td><td class="font-semibold">${escCase(l)}</td><td><input data-cs-value="${k}" value="${escCase(modelValue(store,k))}" class="w-full border-0 outline-none"></td></tr>`).join('')}</tbody></table></div>${sectionRemarks('model_remarks_'+idx,store)}</section>`;
            return '';
        }

        function renderCephalometricSheet(patient){
            const store = patient.caseSheets?.cephalometric_analysis || {};
            return `<div class="case-sheet-print-root case-sheet-paper p-4 space-y-5">
                <div class="flex items-center justify-between gap-3 case-sheet-no-print"><div><h2 class="text-lg font-bold text-slate-900">IV. RADIOGRAPHIC & CEPHALOMETRIC ANALYSIS</h2><p class="text-xs text-slate-500">The supplied analysis sequence and reference columns are retained.</p></div>${caseSheetActions()}</div>
                <div class="case-sheet-no-print flex gap-2 flex-wrap"><button data-ceph-section="analyses" class="case-ceph-nav px-4 py-2 rounded-xl text-xs font-semibold ${appState.caseCephSection==='analyses'?'bg-emerald-600 text-white':'bg-slate-100 text-slate-600'} cursor-pointer">Individual Analyses</button><button data-ceph-section="composite" class="case-ceph-nav px-4 py-2 rounded-xl text-xs font-semibold ${appState.caseCephSection==='composite'?'bg-emerald-600 text-white':'bg-slate-100 text-slate-600'} cursor-pointer">Composite Cephalometric Analysis</button></div>
                ${appState.caseCephSection==='composite' ? renderCompositeCeph(store) : CEPH_ANALYSES.map(a=>renderCephAnalysis(a,store)).join('')}
            </div>`;
        }
        function renderCephAnalysis(a,store){
            if(a.kind==='fields') return `<section><div class="case-sheet-section-title">${escCase(a.title)}</div><table class="case-sheet-table"><thead><tr><th>OBSERVATION</th><th>PATIENT ENTRY</th></tr></thead><tbody>${a.fields.map(([k,l])=>`<tr><td class="font-semibold">${escCase(l)}</td><td><textarea data-cs-value="${k}" rows="1" class="w-full border-0 outline-none">${escCase(modelValue(store,k))}</textarea></td></tr>`).join('')}</tbody></table>${sectionRemarks(a.id+'_remarks',store)}</section>`;
            if(a.kind==='cvm') return `<section><div class="case-sheet-section-title">${escCase(a.title)}</div><table class="case-sheet-table"><thead><tr><th>STAGE</th><th>CLINICIAN ENTRY</th><th>INFERENCE ▼</th></tr></thead><tbody><tr><td>Selected CVM Stage</td><td><input data-cs-value="cvm_stage" value="${escCase(modelValue(store,'cvm_stage'))}" class="w-full border-0 outline-none"></td><td>${inferenceSelect('cvm_stage_inf','cvm',store)}</td></tr></tbody></table><div class="mt-2 text-xs text-slate-500">The supplied form describes stages 1–6 (Initiation, Acceleration, Transition, Deceleration, Maturation, Completion).</div>${sectionRemarks(a.id+'_remarks',store)}</section>`;
            return `<section><div class="case-sheet-section-title">${escCase(a.title)}</div><table class="case-sheet-table"><thead><tr><th>MEASUREMENT</th><th>MEAN / REFERENCE</th><th>PATIENT VALUE</th><th>INFERENCE ▼</th></tr></thead><tbody>${a.rows.map(([k,l,ref,g])=>`<tr><td class="font-semibold">${escCase(l)}</td><td class="text-xs">${escCase(ref)}</td><td><input data-cs-value="${k}" value="${escCase(modelValue(store,k))}" class="w-full border-0 outline-none"></td>${renderInferenceCell(k,g,store)}</tr>`).join('')}</tbody></table>${sectionRemarks(a.id+'_remarks',store)}</section>`;
        }
        function renderCompositeCeph(store){ return `<div class="space-y-5">${COMPOSITE_CEPH_SECTIONS.map((sec,si)=>`<section><div class="case-sheet-section-title">${escCase(sec.title)}</div><table class="case-sheet-table"><thead><tr><th>PARAMETER</th><th>MEAN VALUE</th><th>PRE-TREATMENT</th><th>MID-TREATMENT</th><th>POST-TREATMENT</th><th>RESULT / INFERENCE ▼</th></tr></thead><tbody>${sec.rows.map(([k,l,ref])=>`<tr><td class="font-semibold">${escCase(l)}</td><td class="text-xs">${escCase(ref)}</td><td><input data-cs-value="${k}_pre" value="${escCase(modelValue(store,k+'_pre'))}" class="w-full border-0 outline-none"></td><td><input data-cs-value="${k}_mid" value="${escCase(modelValue(store,k+'_mid'))}" class="w-full border-0 outline-none"></td><td><input data-cs-value="${k}_post" value="${escCase(modelValue(store,k+'_post'))}" class="w-full border-0 outline-none"></td><td>${inferenceSelect(k+'_result','neutral',store)}</td></tr>`).join('')}</tbody></table>${sectionRemarks('comp_remarks_'+si,store)}</section>`).join('')}</div>`; }

        function renderDiagnosisPlanSheet(patient){
            const store = patient.caseSheets?.diagnosis_plan || {};
            return `<div class="case-sheet-print-root case-sheet-paper p-4 space-y-5">
                <div class="flex items-center justify-between gap-3 case-sheet-no-print"><div><h2 class="text-lg font-bold text-slate-900">V. DIAGNOSIS AND TREATMENT PLANNING</h2><p class="text-xs text-slate-500">Original treatment-planning sequence retained.</p></div>${caseSheetActions()}</div>
                ${DIAGNOSIS_PLAN_SECTIONS.map((sec,idx)=>{
                    if(sec.paymentTable) return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div>${renderCaseRowsTable(sec.rows,store)}<table class="case-sheet-table mt-2"><thead><tr><th>PAYMENT</th><th>CHARGES</th><th>RECEIPT NO AND DATE</th></tr></thead><tbody>${[1,2,3,4].map(i=>`<tr><td><input data-cs-value="pay_${i}" value="${escCase(modelValue(store,'pay_'+i))}" class="w-full border-0 outline-none"></td><td><input data-cs-value="charge_${i}" value="${escCase(modelValue(store,'charge_'+i))}" class="w-full border-0 outline-none"></td><td><input data-cs-value="receipt_${i}" value="${escCase(modelValue(store,'receipt_'+i))}" class="w-full border-0 outline-none"></td></tr>`).join('')}</tbody></table></section>`;
                    if(sec.treatmentRecord) return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div><table class="case-sheet-table"><thead><tr><th>DATE</th><th>TREATMENT DONE</th><th>NEXT APPOINTMENT</th><th>SIGNATURE</th><th>REMARK</th></tr></thead><tbody>${Array.from({length:6},(_,i)=>`<tr><td><input data-cs-value="tr_date_${i+1}" type="date" value="${escCase(modelValue(store,'tr_date_'+(i+1)))}" class="w-full border-0 outline-none"></td><td><textarea data-cs-value="tr_treatment_${i+1}" rows="1" class="w-full border-0 outline-none">${escCase(modelValue(store,'tr_treatment_'+(i+1)))}</textarea></td><td><input data-cs-value="tr_next_${i+1}" type="date" value="${escCase(modelValue(store,'tr_next_'+(i+1)))}" class="w-full border-0 outline-none"></td><td><input data-cs-value="tr_signature_${i+1}" value="${escCase(modelValue(store,'tr_signature_'+(i+1)))}" class="w-full border-0 outline-none"></td><td><input data-cs-value="tr_remark_${i+1}" value="${escCase(modelValue(store,'tr_remark_'+(i+1)))}" class="w-full border-0 outline-none"></td></tr>`).join('')}</tbody></table></section>`;
                    return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div>${renderCaseRowsTable(sec.rows,store)}${idx===0?sectionRemarks('diagnosis_remarks',store):''}</section>`;
                }).join('')}
            </div>`;
        }

        function renderCaseSheetsPanel(patient){
            if(!patient) return `<div class="bg-white rounded-2xl p-8 text-center">Patient not found.</div>`;
            if(!patient.caseSheets) patient.caseSheets = { case_history:{}, model_analysis:{}, cephalometric_analysis:{}, diagnosis_plan:{} };
            const active = CASE_SHEET_TYPES[appState.activeCaseSheet] ? appState.activeCaseSheet : 'case_history';
            const isAdmin = isAdminViewingDoctor();
            const content = active==='case_history' ? renderCaseHistorySheet(patient) : active==='model_analysis' ? renderModelAnalysisSheet(patient) : active==='cephalometric_analysis' ? renderCephalometricSheet(patient) : renderDiagnosisPlanSheet(patient);
            return `<div class="grid grid-cols-1 lg:grid-cols-[235px_minmax(0,1fr)] gap-5"><aside class="bg-white rounded-2xl border border-slate-200 shadow-xs p-4 h-fit lg:sticky lg:top-2 case-sheet-no-print"><div class="mb-3"><h3 class="font-bold text-slate-800">Case Sheets</h3><p class="text-xs text-slate-500 mt-1">Original format preserved; clinician selects inference.</p></div><div class="space-y-2">${Object.entries(CASE_SHEET_TYPES).map(([key,meta])=>`<button data-case-sheet="${key}" class="case-sheet-nav w-full text-left p-3 rounded-xl border ${active===key?'border-emerald-300 bg-emerald-50':'border-slate-200 bg-white hover:bg-slate-50'} cursor-pointer"><div class="flex items-center gap-3"><i class="fa-solid ${meta.icon} ${active===key?'text-emerald-600':'text-slate-400'}"></i><div><div class="font-semibold text-sm text-slate-800">${escCase(meta.label)}</div><div class="text-[10px] text-slate-500 mt-0.5">${escCase(meta.desc)}</div></div></div></button>`).join('')}</div>${isAdmin?`<div class="mt-4 bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-600"><i class="fa-solid fa-eye mr-1.5"></i> Administrator view is read-only.</div>`:''}</aside><section>${content}</section></div>`;
        }

        async function loadCaseSheetsForPatient(patientId){
            const patient=appState.patients.find(p=>p.id===patientId); if(!patient||!patientId||patient.caseSheetsLoaded) return;
            appState.caseSheetLoading=true;
            try{
                const {data,error}=await supabaseClient.from('patient_case_sheets').select('*').eq('patient_id',patientId); if(error) throw error;
                patient.caseSheets={case_history:{},model_analysis:{},cephalometric_analysis:{},diagnosis_plan:{}};
                (data||[]).forEach(row=>{ if(CASE_SHEET_TYPES[row.sheet_type]) patient.caseSheets[row.sheet_type]=row.data||{}; }); patient.caseSheetsLoaded=true;
            } finally { appState.caseSheetLoading=false; }
        }
        async function ensureCaseSheetsLoaded(patientId){
            if(!patientId) return; const patient=appState.patients.find(p=>p.id===patientId); if(!patient||patient.caseSheetsLoaded) return;
            try{ await loadCaseSheetsForPatient(patientId); if(appState.currentView==='patient_detail'&&appState.selectedPatientId===patientId&&appState.activeSubTab==='case_sheets') render(); }
            catch(error){ console.error(error); showToast(`Unable to load case sheets: ${error.message||'Unknown error'}`,'error'); }
        }
        function collectCaseSheetForm(){
            const out={}; document.querySelectorAll('[data-cs-value]').forEach(el=>{ const key=el.getAttribute('data-cs-value'); out[key]={...(out[key]||{}),value:el.type==='checkbox'?(el.checked?'true':'false'):(el.value||'')}; });
            document.querySelectorAll('[data-cs-inference]').forEach(el=>{ const key=el.getAttribute('data-cs-inference'); out[key]={...(out[key]||{}),inference:el.value||''}; });
            document.querySelectorAll('[data-cs-remark]').forEach(el=>{ const key=el.getAttribute('data-cs-remark'); out[key]={...(out[key]||{}),remark:el.value||''}; });
            return out;
        }
        async function saveCaseSheetToCloud(patient,sheetType,payload){
            if(!patient?.id||isAdminViewingDoctor()) throw new Error('Administrator view is read-only.'); const ownerId=patient.ownerId||appState.user?.id; if(!ownerId) throw new Error('Patient owner could not be identified.');
            const {data,error}=await supabaseClient.from('patient_case_sheets').upsert({owner_id:ownerId,patient_id:patient.id,sheet_type:sheetType,data:payload,updated_at:new Date().toISOString()},{onConflict:'patient_id,sheet_type'}).select('*').single(); if(error) throw error;
            if(!patient.caseSheets) patient.caseSheets={case_history:{},model_analysis:{},cephalometric_analysis:{},diagnosis_plan:{}}; patient.caseSheets[sheetType]=data.data||{}; patient.caseSheetsLoaded=true; return data;

                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Planned Work / Reason</label>
                                    <input type="text" id="appointment-planned-work" placeholder="e.g. Wire change / review / IPR" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Notes</label>
                                    <textarea id="appointment-notes" rows="3" placeholder="Optional appointment notes…" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                                </div>
                                <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                                    <button type="button" id="modal-cancel" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 cursor-pointer">Cancel</button>
                                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-emerald-600 text-white shadow-md cursor-pointer">Create Appointment</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            } else if (appState.modalType === 'reschedule_appointment') {
                const appointment = appState.appointments.find(a => a.id === appState.rescheduleAppointmentId);
                if (!appointment) return '';
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                const minDate = localDateISO(tomorrow);
                return `
                    <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
                        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden">
                            <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                                <div><h3 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-calendar-arrow-up text-emerald-400"></i> Reschedule Appointment</h3><p class="text-[11px] text-slate-400 mt-1">${escapeHtml(humanDate(appointment.appointmentDate))}${appointment.appointmentTime ? ` • ${escapeHtml(formatAppointmentTime(appointment.appointmentTime))}` : ''}</p></div>
                                <button id="modal-close" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
                            </div>
                            <form id="reschedule-appointment-form" class="p-6 space-y-4">
                                <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800"><i class="fa-solid fa-circle-info mr-1.5"></i>The original appointment remains in the history. It will be marked <strong>${appointment.status === 'no_show' ? 'No-show' : 'Rescheduled'}</strong> and a new appointment will be created.</div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">New Date</label>
                                        <input type="date" id="reschedule-date" required min="${minDate}" value="${minDate}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">New Time</label>
                                        <input type="time" id="reschedule-time" required value="${escapeHtml(appointment.appointmentTime || '17:00').slice(0,5)}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Reason / Note</label>
                                    <textarea id="reschedule-note" rows="3" placeholder="e.g. Patient requested a later date…" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                                </div>
                                <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                                    <button type="button" id="modal-cancel" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 cursor-pointer">Cancel</button>
                                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-emerald-600 text-white shadow-md cursor-pointer"><i class="fa-solid fa-calendar-check mr-1.5"></i>Save New Appointment</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            } else if (appState.modalType === 'upload_photo') {
                return `
                    <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
                        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
                            <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                                <h3 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-cloud-arrow-up text-emerald-400"></i> Upload Clinical Record</h3>
                                <button id="modal-close" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
                            </div>
                            <form id="upload-form" class="p-6 space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Caption / Notes</label>
                                    <input type="text" id="upload-caption" placeholder="e.g. Initial alignment progress" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Select Image File</label>
                                    <input type="file" id="upload-file-input" required accept="image/*" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                    <div class="mt-2 flex items-start gap-2 text-[11px] leading-4 text-slate-500">
                                        <i class="fa-solid fa-compress text-emerald-600 mt-0.5"></i>
                                        <span>Photos are automatically optimized in your browser before upload to reduce Supabase storage use. Clinical proportions are preserved; photographs are targeted around 2000 px and radiographs around 2400 px.</span>
                                    </div>
                                </div>
                                <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                                    <button type="button" id="modal-cancel" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 cursor-pointer">Cancel</button>
                                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-emerald-600 text-white shadow-md cursor-pointer">Upload & Save</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            }
            return '';
        }
    </script>
</body>
</html>
