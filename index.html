        function getFileExtension(file) {
            const name = file.name || '';
            const dot = name.lastIndexOf('.');
            if (dot >= 0) return name.slice(dot).toLowerCase().replace(/[^a-z0-9.]/g, '');
            const type = (file.type || '').toLowerCase();
            return type === 'image/png' ? '.png' : type === 'image/webp' ? '.webp' : '.jpg';
        }

        function formatFileSize(bytes) {
            if (!Number.isFinite(bytes) || bytes < 0) return '0 B';
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
        }

        function compressionProfile(category) {
            // Photographic records can be compressed more aggressively while
            // cephalograms/OPGs retain a little more resolution and quality.
            const radiographic = category === 'cephalogram' || category === 'opg';
            return radiographic
                ? { maxDimension: 2400, quality: 0.90, targetBytes: 2.5 * 1024 * 1024 }
                : { maxDimension: 2000, quality: 0.84, targetBytes: 900 * 1024 };
        }

        function loadImageForCompression(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('The selected image could not be read.')); };
                img.src = url;
            });
        }

        function canvasToJpegBlob(canvas, quality) {
            return new Promise((resolve, reject) => {
                canvas.toBlob(blob => {
                    if (blob) resolve(blob);
                    else reject(new Error('Browser image optimization failed.'));
                }, 'image/jpeg', quality);
            });
        }

        async function optimizeClinicalImage(file, category) {
            if (!file) throw new Error('Please select an image file.');
            if (!file.type?.startsWith('image/')) throw new Error('Only image files are accepted.');
            if (file.size > MAX_UPLOAD_BYTES) throw new Error('Please choose an image smaller than 10 MB.');

            // Very small vector files are left alone; raster clinical records are optimized.
            if (file.type === 'image/svg+xml') return { file, originalSize: file.size, optimizedSize: file.size, compressed: false };

            const profile = compressionProfile(category);
            let image;
            try {
                image = await loadImageForCompression(file);
            } catch (error) {
                console.warn('Image optimization skipped:', error.message);
                return { file, originalSize: file.size, optimizedSize: file.size, compressed: false };
            }

            const sourceWidth = image.naturalWidth || image.width;
            const sourceHeight = image.naturalHeight || image.height;
            if (!sourceWidth || !sourceHeight) {
                return { file, originalSize: file.size, optimizedSize: file.size, compressed: false };
            }

            const scale = Math.min(1, profile.maxDimension / Math.max(sourceWidth, sourceHeight));
            const width = Math.max(1, Math.round(sourceWidth * scale));
            const height = Math.max(1, Math.round(sourceHeight * scale));

            // Do not create an unnecessarily larger file when the uploaded image is already compact.
            if (scale === 1 && file.size <= profile.targetBytes && file.type === 'image/jpeg') {
                return { file, originalSize: file.size, optimizedSize: file.size, compressed: false };
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d', { alpha: false });
            if (!ctx) throw new Error('Browser image canvas is unavailable.');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(image, 0, 0, width, height);

            let blob = await canvasToJpegBlob(canvas, profile.quality);

            // Reduce quality only when the first pass is still larger than the practical target.
            if (blob.size > profile.targetBytes) {
                for (const quality of [0.78, 0.70, 0.64]) {
                    const candidate = await canvasToJpegBlob(canvas, quality);
                    blob = candidate;
                    if (blob.size <= profile.targetBytes) break;
                }
            }

            // Keep the original if optimization does not actually save space.
            if (blob.size >= file.size) {
                return { file, originalSize: file.size, optimizedSize: file.size, compressed: false };
            }

            const safeBaseName = (file.name || 'clinical-record').replace(/\.[^.]+$/, '');
            const optimizedFile = new File([blob], `${safeBaseName}.jpg`, {
                type: 'image/jpeg',
                lastModified: Date.now()
            });

            return {
                file: optimizedFile,
                originalSize: file.size,
                optimizedSize: optimizedFile.size,
                compressed: true
            };
        }

        async function uploadClinicalRecord({ patient, category, slot, stage, file, caption }) {
            if (!file) throw new Error('Please select an image file.');
            if (!file.type?.startsWith('image/')) throw new Error('Only image files are accepted.');
            if (file.size > MAX_UPLOAD_BYTES) throw new Error('Please choose an image smaller than 10 MB.');

            const existing = patient.stages?.[stage]?.[category]?.[slot] || {};
            const optimized = await optimizeClinicalImage(file, category);
            const uploadFile = optimized.file;
            const extension = optimized.compressed ? '.jpg' : getFileExtension(uploadFile);
            const path = `${appState.user.id}/${patient.id}/${stage}/${category}/${slot}-${crypto.randomUUID()}${extension}`;

            const { error: uploadError } = await supabaseClient.storage
                .from(SUPABASE_BUCKET)
                .upload(path, uploadFile, {
                    cacheControl: '3600',
                    contentType: uploadFile.type,
                    upsert: false
                });
            if (uploadError) throw uploadError;

            const { data: row, error: dbError } = await supabaseClient
                .from('clinical_records')
                .upsert({
                    owner_id: appState.user.id,
                    patient_id: patient.id,
                    stage,
                    category,
                    slot,
                    storage_path: path,
                    caption: caption || 'Clinical Record',
                    original_filename: file.name || '',
                    content_type: uploadFile.type || '',
                    size_bytes: uploadFile.size
                }, { onConflict: 'patient_id,stage,category,slot' })
                .select('*')
                .single();

            if (dbError) {
                await supabaseClient.storage.from(SUPABASE_BUCKET).remove([path]);
                throw dbError;
            }

            if (existing.storagePath && existing.storagePath !== path) {
                const { error: oldRemoveError } = await supabaseClient.storage.from(SUPABASE_BUCKET).remove([existing.storagePath]);
                if (oldRemoveError) console.warn('Old file could not be removed:', oldRemoveError.message);
            }

            const signedUrl = await signedUrlFor(path);
            setRecordInPatient(patient, row, signedUrl);
            return optimized;
        }

        async function deleteClinicalRecord(patient, category, slot, stage) {
            const record = patient.stages?.[stage]?.[category]?.[slot] || {};
            if (!record.recordId && !record.storagePath) return;

            if (record.storagePath) {
                const { error: storageError } = await supabaseClient.storage.from(SUPABASE_BUCKET).remove([record.storagePath]);
                if (storageError) console.warn('File removal warning:', storageError.message);
            }

            if (record.recordId) {
                const { error } = await supabaseClient.from('clinical_records').delete().eq('id', record.recordId);
                if (error) throw error;
            } else {
                const { error } = await supabaseClient
                    .from('clinical_records')
                    .delete()
                    .eq('patient_id', patient.id)
                    .eq('stage', stage)
                    .eq('category', category)
                    .eq('slot', slot);
                if (error) throw error;
            }

            patient.stages[stage][category][slot] = {};
        }

                submit.disabled = true;
                try {
                    const newPatient = await createPatientInCloud({
                        name: document.getElementById('new-name').value,
                        age: document.getElementById('new-age').value,
                        gender: document.getElementById('new-gender').value,
                        phone: document.getElementById('new-phone').value,
                        malocclusion: document.getElementById('new-malocclusion').value,

                    showToast(`Patient could not be created: ${error.message || 'Unknown error'}`, 'error');

                }
            });

            document.getElementById('add-appointment-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const submit = e.currentTarget.querySelector('button[type="submit"]');
                submit.disabled = true;
                const oldText = submit.textContent;
                submit.textContent = 'Creating…';
                try {
                    const appointment = await createAppointmentInCloud({
                        patientId: document.getElementById('appointment-patient')?.value || '',
                        date: document.getElementById('appointment-date')?.value || '',
                        time: document.getElementById('appointment-time')?.value || '',
                        plannedWork: document.getElementById('appointment-planned-work')?.value || '',

                    upsertLocalAppointment(appointment);
                    appState.selectedAppointmentDate = appointment.appointmentDate;
                    const appointmentDate = new Date(`${appointment.appointmentDate}T00:00:00`);
                    appState.appointmentYear = appointmentDate.getFullYear();
                    appState.appointmentMonth = appointmentDate.getMonth();
                    appState.modalOpen = false;
                    appState.modalType = null;
                    showToast('Appointment created successfully.');
                    render();
                } catch (error) {
                    console.error(error);
                    showToast(`Appointment could not be created: ${error.message || 'Unknown error'}`, 'error');
                    submit.disabled = false;
                    submit.textContent = oldText;
                }
            });

            document.getElementById('reschedule-appointment-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const appointment = appState.appointments.find(a => a.id === appState.rescheduleAppointmentId);
                const submit = e.currentTarget.querySelector('button[type="submit"]');
                if (!appointment) return;
                submit.disabled = true;
                const oldText = submit.innerHTML;
                submit.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i>Saving…';
                try {
                    await rescheduleAppointmentInCloud(
                        appointment,
                        document.getElementById('reschedule-date')?.value || '',
                        document.getElementById('reschedule-time')?.value || '',
                        document.getElementById('reschedule-note')?.value || ''
                    );
                    const newAppointment = appState.appointments[appState.appointments.length - 1];
                    appState.selectedAppointmentDate = newAppointment.appointmentDate;
                    const newDate = new Date(`${newAppointment.appointmentDate}T00:00:00`);
                    appState.appointmentYear = newDate.getFullYear();
                    appState.appointmentMonth = newDate.getMonth();
                    appState.appointmentView = 'today';
                    appState.modalOpen = false;
                    appState.modalType = null;
                    appState.rescheduleAppointmentId = null;
                    showToast('Appointment rescheduled successfully.');
                    render();
                } catch (error) {
                    console.error(error);
                    showToast(`Appointment could not be rescheduled: ${error.message || 'Unknown error'}`, 'error');
                    submit.disabled = false;
                    submit.innerHTML = oldText;
                }
            });

            document.getElementById('upload-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const fileInput = document.getElementById('upload-file-input');
                const captionInput = document.getElementById('upload-caption');
                const submit = e.currentTarget.querySelector('button[type="submit"]');
                const file = fileInput?.files[0];
                const p = appState.patients.find(x => x.id === appState.selectedPatientId);
                const { category, slot } = appState.activePhotoSlot || {};
                if (!file || !p || !category || !slot) return;

                submit.disabled = true;
                const originalText = submit.textContent;
                submit.textContent = 'Uploading…';
                try {
                    const uploadResult = await uploadClinicalRecord({
                        patient: p,
                        category,
                        slot,
                        stage: appState.activeStageTab,
                        file,
                        caption: captionInput?.value || 'Clinical Record'
                    });

                    // Explicitly close after a successful upload. This is the requested modal fix.
                    appState.modalOpen = false;
                    appState.modalType = null;
                    appState.activePhotoSlot = null;
                    const savedMessage = uploadResult.compressed
                        ? `Record uploaded and optimized: ${formatFileSize(uploadResult.originalSize)} → ${formatFileSize(uploadResult.optimizedSize)}.`
                        : 'Record uploaded successfully.';
                    showToast(savedMessage);
                    render();
                } catch (error) {
                    console.error(error);
                    showToast(`Record upload failed: ${error.message || 'Unknown error'}`, 'error');
                    submit.disabled = false;
                    submit.textContent = originalText;
                }
            });
        }

        async function initializeApp() {
            if (!SUPABASE_CONFIGURED) {
                appState.booting = false;
                render();
                return;
            }

            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_OUT') {
                    clearPatientPortalSession();
                    appState.user = null;
                    appState.patients = [];
                    appState.doctorName = '';
                    appState.doctorEmail = '';
                    appState.currentView = 'login';
                    appState.booting = false;
                    render();
                } else if (event === 'SIGNED_IN' && session?.user) {
                    setTimeout(() => finishAuthentication(session.user), 0);
                }
            });

            try {
                const { data, error } = await supabaseClient.auth.getSession();
                if (error) throw error;
                if (data.session?.user) {
                    await finishAuthentication(data.session.user);
                } else {
                    appState.booting = false;
                    render();
                }
            } catch (error) {
                console.error(error);
                appState.booting = false;
                render();
                showToast(`Unable to initialize secure login: ${error.message || 'Unknown error'}`, 'error');
            }
        }

        function attachPatientPortalListeners() {
            document.getElementById('patient-portal-logout')?.addEventListener('click', () => {
                clearPatientPortalSession();
                appState.portalMode = 'patient';
                appState.currentView = 'login';
                render();
            });

            const form = document.getElementById('patient-appointment-form');
            form?.addEventListener('submit', async e => {
                e.preventDefault();
                const date = document.getElementById('patient-book-date')?.value || '';
                const time = document.getElementById('patient-book-time')?.value || '';
                const reason = document.getElementById('patient-book-reason')?.value || '';
                const submit = form.querySelector('button[type="submit"]');
                submit.disabled = true;
                submit.classList.add('opacity-60');
                submit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Sending Request…</span>';
                try {
                    await requestPatientPortalAppointment(date, time, reason);
                    showToast('Appointment request sent to your doctor.');
                    render();
                } catch (error) {
                    console.error(error);
                    showToast(error.message || 'Appointment request failed.', 'error');
                    submit.disabled = false;
                    submit.classList.remove('opacity-60');
                    submit.innerHTML = '<i class="fa-solid fa-calendar-plus"></i><span>Request Appointment</span>';
                }
            });
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

            { title:'D. INTRA ORAL EXAMINATION (HARD TISSUE) — MANDIBULAR ARCH', rows:[['md_shape','1) Shape of the arch','text'],['md_symmetry','2) Symmetry of arch','text'],['md_teeth_present','3) Teeth present','textarea'],['md_unerupted','4) Unerupted teeth','textarea'],['md_dev','5) Developmental status of Occlusion','select:Deciduous|Mixed|Permanent'],['md_abnormality','6) Individual tooth abnormality','textarea'],['md_number','7) Variation in number of teeth','textarea'],['md_morphology','8) Variation in morphology & structure','textarea'],['md_midline','9) Lower midline w.r.t. skeletal midline','text'],['md_other','10) Any other findings','textarea'],['md_curve_spee','11) Curve of Spee','select:Normal|Flat|Deep']]},

        function caseSheetValue(store, key) { return (store && store[key]?.value) ?? ''; }
        function caseSheetInference(store, key) { return (store && store[key]?.inference) ?? ''; }
        function caseSheetRemark(store, key) { return (store && store[key]?.remark) ?? ''; }
        function escCase(value) { return escapeHtml(value == null ? '' : String(value)); }
        function caseFieldControl(key, label, type, store) {
            const value = caseSheetValue(store, key);
            if (type.startsWith('select:')) {
                const opts = type.slice(7).split('|');
                return `<select data-cs-value="${escCase(key)}" class="w-full border-0 outline-none text-sm"><option value=""></option>${opts.map(o=>`<option ${value===o?'selected':''}>${escCase(o)}</option>`).join('')}</select>`;
            }
            if (type === 'textarea') return `<textarea data-cs-value="${escCase(key)}" rows="2" class="w-full border-0 outline-none text-sm resize-y" placeholder="">${escCase(value)}</textarea>`;
            return `<input data-cs-value="${escCase(key)}" type="${type === 'currency' ? 'number' : type}" value="${escCase(value)}" class="w-full border-0 outline-none text-sm ${type==='currency'?'text-right':''}" ${type==='currency'?'min="0" step="1"':''}>`;
        }
        const INFERENCE_BLANK_SENTINEL = '__BLANK_HANDWRITTEN__';
        function normalizeInferenceValue(value) {
            return value || '';
        }
        function inferenceSelect(key, group, store) {
            const opts = INFERENCE_OPTIONS[group] || INFERENCE_OPTIONS.neutral;
            const stored = normalizeInferenceValue(caseSheetInference(store,key));
            const displayBlank = stored === INFERENCE_BLANK_SENTINEL;
            return `<select data-cs-inference="${escCase(key)}" class="case-sheet-inference w-full border border-slate-300 rounded px-2 py-1.5 text-xs ${displayBlank ? 'blank-selected' : ''}">` +
                   `<option value="">${displayBlank ? '' : 'Select inference'}</option>` +
                   opts.map(o=>`<option value="${escCase(o)}" ${stored===o?'selected':''}>${escCase(o)}</option>`).join('') +
                   `<option value="${INFERENCE_BLANK_SENTINEL}" ${displayBlank?'selected':''}>Other / handwritten blank</option></select>`;
        }
        function renderCaseRowsTable(rows, store, group='neutral') {
            return `<div class="overflow-x-auto"><table class="case-sheet-table min-w-[780px]"><tbody>${rows.map(([key,label,type])=>`<tr><td class="font-semibold w-1/3">${escCase(label)}</td><td>${caseFieldControl(key,label,type,store)}</td></tr>`).join('')}</tbody></table></div>`;
        }
        function sectionRemarks(key, store) { return `<div class="mt-2"><div class="text-[11px] font-semibold uppercase tracking-wide text-slate-500">Remarks / If any</div><textarea data-cs-remark="${escCase(key)}" class="w-full border border-slate-300 rounded px-2 py-1.5 text-sm mt-1" rows="2">${escCase(caseSheetRemark(store,key))}</textarea></div>`; }

        function renderCaseHistorySheet(patient) {

                <section><div class="case-sheet-section-title">CONSENT FORM</div><div class="border border-black p-4 text-sm leading-6">I have been explained about the possibilities and limitation of treatment and side effect including demineralization of enamel (discolorations) and limitation of gums. I have also been briefed about the Duration, Maintenance of appliance, keeping of Appointments and the Financial Commitments pertaining to the treatment. I agree with the above treatment plan and give my full consent for the Treatment Procedure as deemed Necessary.</div><table class="case-sheet-table mt-2"><tbody><tr><td class="font-semibold w-1/3">Patient Name</td><td><input data-cs-value="consent_patient_name" value="${escCase(caseSheetValue(store,'consent_patient_name') || patient.name || '')}" class="w-full border-0 outline-none"></td></tr><tr><td class="font-semibold">Age</td><td><input data-cs-value="consent_age" value="${escCase(caseSheetValue(store,'consent_age') || patient.age || '')}" class="w-full border-0 outline-none"></td></tr><tr><td class="font-semibold">Name & Signature (Parent /Guardian)</td><td><input data-cs-value="consent_signature" value="${escCase(caseSheetValue(store,'consent_signature'))}" class="w-full border-0 outline-none"></td></tr><tr><td class="font-semibold">Date</td><td><input data-cs-value="consent_date" type="date" value="${escCase(caseSheetValue(store,'consent_date'))}" class="w-full border-0 outline-none"></td></tr></tbody></table></section>

                ${CASE_HISTORY_SECTIONS.slice(1).map((sec, idx)=>{
                    if(sec.family) return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div><table class="case-sheet-table"><thead><tr><th></th><th>FATHER</th><th>MOTHER</th><th>SIBLINGS</th><th>IF ANY / REMARKS</th></tr></thead><tbody><tr><td class="font-semibold">Malocclusion</td>${['father','mother','siblings'].map(x=>`<td><select data-cs-value="family_malocclusion_${x}" class="w-full border-0 outline-none text-sm"><option value=""></option><option ${caseSheetValue(store,'family_malocclusion_'+x)==='Yes'?'selected':''}>Yes</option><option ${caseSheetValue(store,'family_malocclusion_'+x)==='No'?'selected':''}>No</option></select></td>`).join('')}<td rowspan="2"><textarea data-cs-remark="family_remarks" class="w-full border-0 outline-none text-sm" rows="4">${escCase(caseSheetRemark(store,'family_remarks'))}</textarea></td></tr><tr><td class="font-semibold">Familial diseases</td>${['father','mother','siblings'].map(x=>`<td><select data-cs-value="family_disease_${x}" class="w-full border-0 outline-none text-sm"><option value=""></option><option ${caseSheetValue(store,'family_disease_'+x)==='Yes'?'selected':''}>Yes</option><option ${caseSheetValue(store,'family_disease_'+x)==='No'?'selected':''}>No</option></select></td>`).join('')}</tr></tbody></table></section>`;

        }

        function caseSheetActions(){ return `<div class="flex gap-2"><button id="case-sheet-save" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-semibold cursor-pointer"><i class="fa-solid fa-floppy-disk mr-1.5"></i>Save</button><button id="case-sheet-print" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-semibold cursor-pointer"><i class="fa-solid fa-print mr-1.5"></i>Print</button><button id="case-sheet-clear" class="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-sm font-semibold cursor-pointer"><i class="fa-solid fa-eraser mr-1.5"></i>Clear</button></div>`; }

        function modelValue(store,key){ return caseSheetValue(store,key); }
        function renderInferenceCell(key, group, store){ return `<td>${inferenceSelect(key,group,store)}</td>`; }
        function renderModelAnalysisSheet(patient){

            </div>`;
        }
        function renderModelSection(sec,store,idx){
            if(sec.type==='table') return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div><table class="case-sheet-table"><thead><tr><th>RELATION</th><th>RIGHT</th><th>LEFT</th></tr></thead><tbody>${sec.rows.map(([k,l])=>`<tr><td class="font-semibold">${l}</td><td><input data-cs-value="${k}_r" value="${escCase(modelValue(store,k+'_r'))}" class="w-full border-0 outline-none"></td><td><input data-cs-value="${k}_l" value="${escCase(modelValue(store,k+'_l'))}" class="w-full border-0 outline-none"></td></tr>`).join('')}</tbody></table>${sec.footRows.map(([k,l,u,g])=>`<table class="case-sheet-table mt-2"><tbody><tr><td class="font-semibold w-2/5">${escCase(l)}</td><td><input data-cs-value="${k}" value="${escCase(modelValue(store,k))}" class="w-full border-0 outline-none" placeholder="${escCase(u)}"></td></tr><tr><td class="font-semibold">Inference</td><td>${inferenceSelect(k,g,store)}</td></tr></tbody></table>`).join('')}</section>`;
            if(sec.type==='toothwidth' || sec.type==='toothwidth_md') { const prefix=sec.type==='toothwidth'?'mx':'md'; return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div><table class="case-sheet-table"><thead><tr><th>TOOTH NUMBER</th><th>RIGHT</th><th>LEFT</th></tr></thead><tbody>${sec.rows.map(([n])=>`<tr><td>${n}</td><td><input data-cs-value="${prefix}_tooth_${n}_r" value="${escCase(modelValue(store,prefix+'_tooth_'+n+'_r'))}" class="w-full border-0 outline-none"></td><td><input data-cs-value="${prefix}_tooth_${n}_l" value="${escCase(modelValue(store,prefix+'_tooth_'+n+'_l'))}" class="w-full border-0 outline-none"></td></tr>`).join('')}</tbody></table></section>`; }
            if(sec.type==='metrics') return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div><table class="case-sheet-table"><thead><tr><th>PARAMETER</th><th>PATIENT’S VALUE</th><th>NORMAL VALUE</th><th>DIFFERENCE</th></tr></thead><tbody>${sec.rows.map(([k,l,ref,g])=>`<tr><td class="font-semibold">${escCase(l)}</td><td><input data-cs-value="${k}" value="${escCase(modelValue(store,k))}" class="w-full border-0 outline-none"></td><td>${escCase(ref)}</td><td><input data-cs-value="${k}_difference" value="${escCase(modelValue(store,k+'_difference'))}" class="w-full border-0 outline-none"></td></tr><tr><td class="font-semibold">Inference</td><td colspan="3">${inferenceSelect(k,g,store)}</td></tr>`).join('')}</tbody></table></section>`;
            if(sec.type==='metrics2') return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div><table class="case-sheet-table"><thead><tr><th>REGION</th><th>RIGHT</th><th>LEFT</th><th>DIFFERENCE</th></tr></thead><tbody>${sec.rows.map(([k,l])=>`<tr><td class="font-semibold">${escCase(l)}</td><td><input data-cs-value="${k}_r" value="${escCase(modelValue(store,k+'_r'))}" class="w-full border-0 outline-none"></td><td><input data-cs-value="${k}_l" value="${escCase(modelValue(store,k+'_l'))}" class="w-full border-0 outline-none"></td><td><input data-cs-value="${k}_difference" value="${escCase(modelValue(store,k+'_difference'))}" class="w-full border-0 outline-none"></td></tr><tr><td class="font-semibold">Inference</td><td colspan="3">${inferenceSelect(k,'symmetry',store)}</td></tr>`).join('')}</tbody></table></section>`;
            if(sec.type==='archindex') return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div><table class="case-sheet-table"><thead><tr><th>REGION / INDEX</th><th>ACTUAL</th><th>CALCULATED VALUE (CV)</th><th>DIFFERENCE</th></tr></thead><tbody>${sec.rows.map(([k,l,ref,g])=>`<tr><td class="font-semibold">${escCase(l)}</td><td><input data-cs-value="${k}" value="${escCase(modelValue(store,k))}" class="w-full border-0 outline-none"></td><td>${escCase(ref)}</td><td><input data-cs-value="${k}_difference" value="${escCase(modelValue(store,k+'_difference'))}" class="w-full border-0 outline-none"></td></tr><tr><td class="font-semibold">Inference</td><td colspan="3">${inferenceSelect(k,g,store)}</td></tr>`).join('')}</tbody></table></section>`;
            if(sec.type==='indexRows') return `<section><div class="case-sheet-section-title">${escCase(sec.title)}</div><table class="case-sheet-table"><thead><tr><th>PARAMETER</th><th>PATIENT / ACTUAL</th><th>CALCULATED / REFERENCE</th><th>DIFFERENCE</th></tr></thead><tbody>${sec.rows.map(([k,l,ref,g])=>`<tr><td class="font-semibold">${escCase(l)}</td><td><input data-cs-value="${k}" value="${escCase(modelValue(store,k))}" class="w-full border-0 outline-none"></td><td>${escCase(ref)}</td><td><input data-cs-value="${k}_difference" value="${escCase(modelValue(store,k+'_difference'))}" class="w-full border-0 outline-none"></td></tr><tr><td class="font-semibold">Inference</td><td colspan="3">${inferenceSelect(k,g,store)}</td></tr>`).join('')}</tbody></table></section>`;

            return '';
        }

        function renderCephalometricSheet(patient){

        function renderCephAnalysis(a,store){

        function renderCompositeCeph(store){ return `<div class="space-y-5">${COMPOSITE_CEPH_SECTIONS.map((sec,si)=>`<section><div class="case-sheet-section-title">${escCase(sec.title)}</div><table class="case-sheet-table"><thead><tr><th>PARAMETER</th><th>MEAN VALUE</th><th>PRE-TREATMENT</th><th>MID-TREATMENT</th><th>POST-TREATMENT</th><th>RESULT / INFERENCE</th></tr></thead><tbody>${sec.rows.map(([k,l,ref])=>`<tr><td class="font-semibold">${escCase(l)}</td><td class="text-xs">${escCase(ref)}</td><td><input data-cs-value="${k}_pre" value="${escCase(modelValue(store,k+'_pre'))}" class="w-full border-0 outline-none"></td><td><input data-cs-value="${k}_mid" value="${escCase(modelValue(store,k+'_mid'))}" class="w-full border-0 outline-none"></td><td><input data-cs-value="${k}_post" value="${escCase(modelValue(store,k+'_post'))}" class="w-full border-0 outline-none"></td><td>${inferenceSelect(k+'_result','neutral',store)}</td></tr>`).join('')}</tbody></table></section>`).join('')}</div>`; }

        function renderDiagnosisPlanSheet(patient){

        async function loadCaseSheetsForPatient(patientId){
            const patient=appState.patients.find(p=>p.id===patientId); if(!patient||!patientId||patient.caseSheetsLoaded) return;

            try{
                const {data,error}=await supabaseClient.from('patient_case_sheets').select('*').eq('patient_id',patientId); if(error) throw error;
                patient.caseSheets={case_history:{},model_analysis:{},cephalometric_analysis:{},diagnosis_plan:{}};

            } finally { appState.caseSheetLoading=false; }
        }
        async function ensureCaseSheetsLoaded(patientId){
            if(!patientId) return; const patient=appState.patients.find(p=>p.id===patientId); if(!patient||patient.caseSheetsLoaded) return;

        function collectCaseSheetForm(){
            const out={}; document.querySelectorAll('[data-cs-value]').forEach(el=>{ const key=el.getAttribute('data-cs-value'); out[key]={...(out[key]||{}),value:el.type==='checkbox'?(el.checked?'true':'false'):(el.value||'')}; });
            document.querySelectorAll('[data-cs-inference]').forEach(el=>{ const key=el.getAttribute('data-cs-inference'); const v=el.value===INFERENCE_BLANK_SENTINEL?'':(el.value||''); out[key]={...(out[key]||{}),inference:v}; });
            document.querySelectorAll('[data-cs-remark]').forEach(el=>{ const key=el.getAttribute('data-cs-remark'); out[key]={...(out[key]||{}),remark:el.value||''}; });
            return out;
        }
        async function saveCaseSheetToCloud(patient,sheetType,payload){
            if(!patient?.id||isAdminViewingDoctor()) throw new Error('Administrator view is read-only.'); const ownerId=patient.ownerId||appState.user?.id; if(!ownerId) throw new Error('Patient owner could not be identified.');
            const {data,error}=await supabaseClient.from('patient_case_sheets').upsert({owner_id:ownerId,patient_id:patient.id,sheet_type:sheetType,data:payload,updated_at:new Date().toISOString()},{onConflict:'patient_id,sheet_type'}).select('*').single(); if(error) throw error;
            if(!patient.caseSheets) patient.caseSheets={case_history:{},model_analysis:{},cephalometric_analysis:{},diagnosis_plan:{}}; patient.caseSheets[sheetType]=data.data||{}; patient.caseSheetsLoaded=true; return data;
        }
        function bindCaseSheetOtherHints(){
            document.querySelectorAll('[data-cs-inference]').forEach(sel=>{

            });

    <script>
        const SUPABASE_BUCKET = 'clinical-records';
        const MAX_UPLOAD_BYTES = 10 * 1024 * 1024;
        const CONFIG = window.MAITRIORTHO_CONFIG || {};
        const SUPABASE_URL = (CONFIG.SUPABASE_URL || '').trim();

        function todayISO() {
            return new Date().toISOString().split('T')[0];
        }

        function generatePatientCode() {
            // Five-digit patient ID: 10000-99999. This is an identifier, not a password.
            if (window.crypto?.getRandomValues) {
                const array = new Uint32Array(1);
                window.crypto.getRandomValues(array);
                return String(10000 + (array[0] % 90000));
            }
            return String(10000 + Math.floor(Math.random() * 90000));
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800';
            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium transform translate-y-2 opacity-0 transition-all duration-300 pointer-events-auto`;
            const icon = document.createElement('i');
            icon.className = `fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'} text-lg`;
            const span = document.createElement('span');
            span.textContent = message;
            toast.append(icon, span);
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

                    </div>
                </div>
            `;
        }

        function renderSetupRequired() {
            return `

        function render() {
            const app = document.getElementById('app');
            if (!app) return;
            app.innerHTML = '';

            if (!SUPABASE_CONFIGURED) {
                app.innerHTML = renderSetupRequired();
                return;
            }

            if (appState.booting) {
                app.innerHTML = renderLoading();
                return;
            }

            if (appState.currentView === 'login') {
                app.innerHTML = renderLogin();
                attachLoginListeners();
            } else if (appState.currentView === 'patient_portal') {
                app.innerHTML = renderPatientPortal();
                attachPatientPortalListeners();
            } else if (appState.currentView === 'admin_dashboard') {
                app.innerHTML = renderAdminDashboard();
                attachAdminDashboardListeners();
            } else if (appState.currentView === 'dashboard') {
                app.innerHTML = renderDashboard();
                attachDashboardListeners();
            } else if (appState.currentView === 'appointments') {
                app.innerHTML = renderAppointmentScheduler();
                attachAppointmentSchedulerListeners();
            } else if (appState.currentView === 'patient_detail') {
                app.innerHTML = renderPatientDetail();
                attachPatientDetailListeners();
            }

            if (appState.modalOpen) {
                app.innerHTML += renderModal();
                attachModalListeners();
            }
        }

        function emptyStages() {
            return {
                pre: { extraoral: {}, intraoral: {}, bonding: {}, cephalogram: {}, opg: {}, extra_records: {} },
                mid: { extraoral: {}, intraoral: {}, retraction: {}, cephalogram: {}, opg: {}, extra_records: {} },
                post: { extraoral: {}, intraoral: {}, cephalogram: {}, opg: {}, extra_records: {} }
            };

            return {
                id: row.id,
                ownerId: row.owner_id || '',
                patientCode: row.patient_code || '',
                name: row.name || '',
                age: row.age ?? '',
                gender: row.gender || '',
                phone: row.phone || '',
                malocclusion: row.malocclusion || '',
                startDate: row.start_date || todayISO(),

        function setRecordInPatient(patient, record, signedUrl = '') {
            const stage = patient.stages[record.stage];
            if (!stage || !stage[record.category]) return;
            stage[record.category][record.slot] = {
                url: signedUrl || '',
                caption: record.caption || 'Clinical Record',
                storagePath: record.storage_path || '',
                recordId: record.id,
                contentType: record.content_type || '',
                originalFilename: record.original_filename || ''
            };
        }

        async function loadProfile(user) {
            const { data, error } = await supabaseClient
                .from('profiles')
                .select('doctor_name,email,role')
                .eq('id', user.id)
                .maybeSingle();
            if (error) throw error;
            appState.doctorName = data?.doctor_name || user.user_metadata?.doctor_name || 'Doctor';
            appState.doctorEmail = data?.email || user.email || '';
            appState.role = data?.role || 'doctor';
        }

        async function signedUrlFor(path) {
            if (!path) return '';
            const { data, error } = await supabaseClient.storage
                .from(SUPABASE_BUCKET)
                .createSignedUrl(path, 3600);
            if (error) {
                console.warn('Signed URL generation failed:', error.message);
                return '';
            }
            return data?.signedUrl || '';
        }

        async function loadCloudPatients(ownerId = null) {
            let patientQuery = supabaseClient
                .from('patients')
                .select('*')
                .order('created_at', { ascending: false });
            if (ownerId) patientQuery = patientQuery.eq('owner_id', ownerId);

            const { data: patientRows, error: patientError } = await patientQuery;
            if (patientError) throw patientError;

            const patients = (patientRows || []).map(mapPatientRow);
            if (!patients.length) return patients;

            const patientIds = patients.map(p => p.id);
            const { data: recordRows, error: recordError } = await supabaseClient
                .from('clinical_records')
                .select('*')
                .in('patient_id', patientIds)
                .order('created_at', { ascending: true });
            if (recordError) throw recordError;

            const byId = new Map(patients.map(p => [p.id, p]));
            await Promise.all((recordRows || []).map(async record => {
                const patient = byId.get(record.patient_id);
                if (!patient) return;
                const url = await signedUrlFor(record.storage_path);
                setRecordInPatient(patient, record, url);
            }));
            return patients;
        }

        async function loadDoctorsForAdmin() {
            const { data: doctorRows, error: doctorError } = await supabaseClient
                .from('profiles')
                .select('id,doctor_name,email,role,created_at')
                .eq('role', 'doctor')
                .order('doctor_name', { ascending: true });
            if (doctorError) throw doctorError;

            const { data: patientRows, error: patientError } = await supabaseClient
                .from('patients')
                .select('owner_id');
            if (patientError) throw patientError;

            const counts = new Map();
            (patientRows || []).forEach(row => counts.set(row.owner_id, (counts.get(row.owner_id) || 0) + 1));

            appState.doctors = (doctorRows || []).map(d => ({
                id: d.id,
                name: d.doctor_name || 'Doctor',
                email: d.email || '',
                patientCount: counts.get(d.id) || 0,
                createdAt: d.created_at || ''
            }));
            return appState.doctors;
        }

        async function loadPaymentsForPatient(patientId) {
            if (!patientId) return [];
            const ownerId = appointmentOwnerId();
            if (!ownerId) return [];
            const { data, error } = await supabaseClient
                .from('patient_payments')
                .select('*')
                .eq('owner_id', ownerId)
                .eq('patient_id', patientId)
                .order('payment_date', { ascending: false })
                .order('created_at', { ascending: false });
            if (error) throw error;
            const patientRows = (data || []).map(mapPaymentRow);
            appState.payments = [
                ...appState.payments.filter(p => p.patientId !== patientId),
                ...patientRows
            ];
            return patientRows;

        function paymentForAppointment(appointmentId) {
            return (appState.payments || []).find(p => p.appointmentId === appointmentId) || null;
        }

        function totalPaidForPatient(patientId) {
            return (appState.payments || [])
                .filter(p => p.patientId === patientId)
                .reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
        }

        function totalCollectionForDate(date) {
            return (appState.payments || [])
                .filter(p => p.paymentDate === date)
                .reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
        }

        function formatINR(amount) {
            const numeric = Number(amount || 0);
            const hasFraction = Math.abs(numeric - Math.round(numeric)) > 0.0001;
            return new Intl.NumberFormat('en-IN', {
                style: 'currency',
                currency: 'INR',
                minimumFractionDigits: hasFraction ? 2 : 0,
                maximumFractionDigits: hasFraction ? 2 : 0
            }).format(numeric);
        }

        async function savePaymentInCloud(appointment, rawAmount) {
            if (!appointment?.id || isAdminViewingDoctor()) throw new Error('Administrator view is read-only.');
            const amountText = String(rawAmount ?? '').trim();
            const amount = amountText === '' ? 0 : Number(amountText);
            if (!Number.isFinite(amount) || amount < 0) throw new Error('Please enter a valid payment amount in rupees.');

            const existing = paymentForAppointment(appointment.id);
            if (amount === 0) {
                if (!existing) return;
                const { error } = await supabaseClient
                    .from('patient_payments')
                    .delete()
                    .eq('id', existing.id)
                    .eq('owner_id', existing.ownerId);
                if (error) throw error;
                appState.payments = appState.payments.filter(p => p.id !== existing.id);
                return;
            }

            const payload = {
                owner_id: appointment.ownerId,
                patient_id: appointment.patientId,
                appointment_id: appointment.id,
                payment_date: appointment.appointmentDate || localDateISO(),
                amount: Math.round(amount * 100) / 100,
                notes: ''
            };
            const { data, error } = await supabaseClient
                .from('patient_payments')
                .upsert(payload, { onConflict: 'appointment_id' })
                .select('*')
                .single();
            if (error) throw error;

            const mapped = mapPaymentRow(data);
            appState.payments = [
                ...appState.payments.filter(p => p.appointmentId !== appointment.id),
                mapped
            ];
        }

        function patientForAppointment(appointment) {
            return appState.patients.find(p => p.id === appointment.patientId) || null;
        }

        function formatAppointmentTime(timeValue) {
            if (!timeValue) return '—';
            const parts = String(timeValue).slice(0, 5).split(':').map(Number);
            if (parts.length < 2 || Number.isNaN(parts[0]) || Number.isNaN(parts[1])) return String(timeValue);
            const d = new Date(2000, 0, 1, parts[0], parts[1]);
            return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        }

        function appointmentDateTimeKey(a) {
            return `${a.appointmentDate || '9999-12-31'}T${a.appointmentTime || '23:59:59'}`;
        }

        function appointmentStatusLabel(status) {
            const map = {
                scheduled: 'Scheduled',
                requested: 'Patient Requested',
                confirmed: 'Confirmed',
                arrived: 'Arrived',
                completed: 'Completed',
                no_show: 'No-show',
                cancelled: 'Cancelled',
                declined: 'Declined',
                rescheduled: 'Rescheduled'
            };
            return map[status] || (String(status || '').replace(/_/g, ' ') || 'Scheduled');
        }

        function appointmentStatusClasses(status) {
            if (status === 'completed') return 'bg-emerald-50 text-emerald-700 border-emerald-200';
            if (status === 'confirmed') return 'bg-blue-50 text-blue-700 border-blue-200';
            if (status === 'arrived') return 'bg-cyan-50 text-cyan-700 border-cyan-200';
            if (status === 'requested') return 'bg-amber-50 text-amber-700 border-amber-200';
            if (status === 'no_show') return 'bg-rose-50 text-rose-700 border-rose-200';
            if (status === 'cancelled' || status === 'declined') return 'bg-slate-100 text-slate-500 border-slate-200';
            if (status === 'rescheduled') return 'bg-amber-50 text-amber-700 border-amber-200';
            return 'bg-violet-50 text-violet-700 border-violet-200';
        }

        async function createAppointmentInCloud({ patientId, date, time, plannedWork, notes }) {
            const ownerId = appointmentOwnerId();
            if (!ownerId || isAdminViewingDoctor()) throw new Error('Administrator view is read-only.');
            const payload = {
                owner_id: ownerId,
                patient_id: patientId,
                appointment_date: date,
                appointment_time: time || null,
                status: 'scheduled',
                planned_work: (plannedWork || '').trim(),
                work_done: '',
                notes: (notes || '').trim()
            };
            const { data, error } = await supabaseClient
                .from('appointments')
                .insert(payload)
                .select('*')
                .single();
            if (error) throw error;

            // Keep the existing patient's single next-appointment field synchronized
            // with the earliest future scheduled appointment.
            const futureDates = appState.appointments
                .filter(a => a.patientId === patientId && a.appointmentDate && a.appointmentDate >= localDateISO() && ['scheduled', 'requested', 'confirmed'].includes(a.status))
                .map(a => a.appointmentDate)
                .concat(date)
                .sort();
            const nextDate = futureDates[0] || date;
            const patient = appState.patients.find(p => p.id === patientId);
            if (patient && nextDate) {
                const { error: patientError } = await supabaseClient
                    .from('patients')
                    .update({ next_appointment_date: nextDate, updated_at: new Date().toISOString() })
                    .eq('id', patientId);
                if (patientError) console.warn('Next appointment sync warning:', patientError.message);
                patient.nextAppointmentDate = nextDate;
            }
            const mapped = mapAppointmentRow(data);
            upsertLocalAppointment(mapped);
            return mapped;
        }

        async function syncNextAppointmentDateForPatient(patientId) {
            const patient = appState.patients.find(p => p.id === patientId);
            if (!patient) return '';
            const today = localDateISO();
            const futureDates = (appState.appointments || [])
                .filter(a => a.patientId === patientId && a.appointmentDate && !['cancelled', 'declined', 'no_show', 'rescheduled', 'arrived', 'completed'].includes(a.status) && (a.appointmentDate > today || ['scheduled', 'requested', 'confirmed'].includes(a.status) && a.appointmentDate === today))
                .map(a => a.appointmentDate)
                .sort();
            const nextDate = futureDates[0] || null;
            const { error } = await supabaseClient
                .from('patients')
                .update({ next_appointment_date: nextDate, updated_at: new Date().toISOString() })
                .eq('id', patientId);
            if (error) throw error;
            patient.nextAppointmentDate = nextDate || '';
            return nextDate || '';
        }

        async function syncAppointmentWorkToTimeline(appointment) {
            if (!appointment?.id || !appointment.patientId) return;
            const patient = patientForAppointment(appointment);
            if (!patient) return;
            const workDone = String(appointment.workDone || '').trim();
            const ownerId = appointment.ownerId || patient.ownerId || appointmentOwnerId();
            if (!ownerId) return;

            if (!workDone) {
                const existing = Object.values(patient.timeline || {}).find(entry => entry.appointmentId === appointment.id);
                if (existing?.id) {
                    const { error } = await supabaseClient
                        .from('patient_timeline')
                        .delete()
                        .eq('id', existing.id)
                        .eq('owner_id', ownerId);
                    if (error) throw error;
                    delete patient.timeline[existing.eventDate];
                }
                return;
            }

            const payload = {
                owner_id: ownerId,
                patient_id: appointment.patientId,
                event_date: appointment.appointmentDate || localDateISO(),
                appointment_id: appointment.id,
                work_done: workDone
            };
            const { data, error } = await supabaseClient
                .from('patient_timeline')
                .upsert(payload, { onConflict: 'patient_id,event_date' })
                .select('*')
                .single();
            if (error) throw error;
            patient.timeline[data.event_date] = {
                id: data.id,
                eventDate: data.event_date,
                appointmentId: data.appointment_id || appointment.id,
                workDone: data.work_done || '',
                createdAt: data.created_at || '',
                updatedAt: data.updated_at || ''
            };
        }

        async function saveAppointmentWorkDoneToCloud(appointment, workDone) {
            if (!appointment?.id || isAdminViewingDoctor()) throw new Error('Administrator view is read-only.');
            const { data, error } = await supabaseClient
                .from('appointments')
                .update({ work_done: workDone, updated_at: new Date().toISOString() })
                .eq('id', appointment.id)
                .eq('owner_id', appointment.ownerId)
                .select('*')
                .single();
            if (error) throw error;
            Object.assign(appointment, mapAppointmentRow(data));
            await syncAppointmentWorkToTimeline(appointment);
        }

        async function updateAppointmentStatusInCloud(appointment, status) {
            if (!appointment?.id || isAdminViewingDoctor()) throw new Error('Administrator view is read-only.');
            const { data, error } = await supabaseClient
                .from('appointments')
                .update({ status, updated_at: new Date().toISOString() })
                .eq('id', appointment.id)
                .eq('owner_id', appointment.ownerId)
                .select('*')
                .single();
            if (error) throw error;
            Object.assign(appointment, mapAppointmentRow(data));

            if (appointment.status === 'completed' && String(appointment.workDone || '').trim()) {
                await syncAppointmentWorkToTimeline(appointment);
            }
            if (appointment.status === 'completed') {
                const patient = patientForAppointment(appointment);
                if (patient) {
                    const { error: visitError } = await supabaseClient
                        .from('patients')
                        .update({ last_visit: appointment.appointmentDate || localDateISO(), updated_at: new Date().toISOString() })
                        .eq('id', patient.id);
                    if (visitError) console.warn('Last visit sync warning:', visitError.message);
                    patient.lastVisit = appointment.appointmentDate || localDateISO();
                }
            }
            await syncNextAppointmentDateForPatient(appointment.patientId);
        }

        function appointmentCanBeMarkedArrived(appointment) {
            return ['scheduled', 'confirmed'].includes(appointment?.status);
        }

        function appointmentCanBeMarkedNoShow(appointment) {
            return ['scheduled', 'confirmed', 'arrived'].includes(appointment?.status);
        }

        function appointmentCanBeRescheduled(appointment) {
            return ['scheduled', 'requested', 'confirmed', 'arrived', 'no_show'].includes(appointment?.status);
        }

        async function rescheduleAppointmentInCloud(appointment, newDate, newTime, reason = '') {
            if (!appointment?.id || isAdminViewingDoctor()) throw new Error('Administrator view is read-only.');
            if (!newDate || !newTime) throw new Error('Please choose a new date and time.');
            if (newDate < localDateISO()) throw new Error('New appointment date cannot be in the past.');

            const newStatusForOld = appointment.status === 'no_show' ? 'no_show' : 'rescheduled';
            const { data: oldData, error: oldError } = await supabaseClient
                .from('appointments')
                .update({ status: newStatusForOld, updated_at: new Date().toISOString() })
                .eq('id', appointment.id)
                .eq('owner_id', appointment.ownerId)
                .select('*')
                .single();
            if (oldError) throw oldError;

            const carryNotes = [
                appointment.notes,
                reason ? `Rescheduled note: ${reason.trim()}` : '',
                `Rescheduled from ${humanDate(appointment.appointmentDate)}${appointment.appointmentTime ? ` at ${formatAppointmentTime(appointment.appointmentTime)}` : ''}.`
            ].filter(Boolean).join(' ');

            const payload = {
                owner_id: appointment.ownerId,
                patient_id: appointment.patientId,
                appointment_date: newDate,
                appointment_time: newTime,
                status: 'scheduled',
                planned_work: appointment.plannedWork || '',
                work_done: '',
                notes: carryNotes,
                rescheduled_from_id: appointment.id
            };

            const { data: newData, error: newError } = await supabaseClient
                .from('appointments')
                .insert(payload)
                .select('*')
                .single();
            if (newError) {
                // Roll the original status back if the replacement appointment could not be created.
                await supabaseClient
                    .from('appointments')
                    .update({ status: appointment.status, updated_at: new Date().toISOString() })
                    .eq('id', appointment.id)
                    .eq('owner_id', appointment.ownerId);
                throw newError;
            }

            Object.assign(appointment, mapAppointmentRow(oldData));
            const newAppointment = mapAppointmentRow(newData);
            appState.appointments.push(newAppointment);
            appState.appointments.sort((a,b) => appointmentDateTimeKey(a).localeCompare(appointmentDateTimeKey(b)));

            // Keep the existing patient-level next appointment date aligned with the earliest active future visit.
            const futureDates = appState.appointments
                .filter(a => a.patientId === appointment.patientId && a.appointmentDate && a.appointmentDate >= localDateISO() && ['scheduled', 'requested', 'confirmed'].includes(a.status))
                .map(a => a.appointmentDate)
                .sort();
            const patient = appState.patients.find(p => p.id === appointment.patientId);
            if (patient) {
                const nextDate = futureDates[0] || null;
                const { error: patientError } = await supabaseClient
                    .from('patients')
                    .update({ next_appointment_date: nextDate, updated_at: new Date().toISOString() })
                    .eq('id', patient.id);
                if (patientError) console.warn('Next appointment sync warning:', patientError.message);
                patient.nextAppointmentDate = nextDate || '';
            }
            return newAppointment;
        }

        function getAppointmentsForDate(date) {
            return (appState.appointments || [])
                .filter(a => a.appointmentDate === date)
                .sort((a, b) => appointmentDateTimeKey(a).localeCompare(appointmentDateTimeKey(b)));
        }

        function getPatientAppointmentsForDate(patientId, date) {
            return getAppointmentsForDate(date).filter(a => a.patientId === patientId);
        }

        function upsertLocalAppointment(appointment) {
            if (!appointment?.id) return;
            const index = appState.appointments.findIndex(a => a.id === appointment.id);
            if (index >= 0) appState.appointments[index] = appointment;
            else appState.appointments.push(appointment);
            appState.appointments.sort((a, b) => appointmentDateTimeKey(a).localeCompare(appointmentDateTimeKey(b)));
        }

        async function ensureVisitAppointmentForPatientDate(patient, date, options = {}) {
            if (!patient?.id || !date || isAdminViewingDoctor()) {
                throw new Error('Administrator view is read-only.');
            }
            const ownerId = patient.ownerId || appState.user?.id;
            if (!ownerId) throw new Error('Doctor ownership could not be determined.');

            const workDone = options.workDone !== undefined ? String(options.workDone || '').trim() : undefined;
            const status = options.status || 'completed';
            const time = options.time || '';
            const plannedWork = String(options.plannedWork || '').trim();
            const notes = String(options.notes || '').trim();

            const existing = getPatientAppointmentsForDate(patient.id, date)[0] || null;
            if (existing) {
                const patch = { updated_at: new Date().toISOString() };
                if (workDone !== undefined) patch.work_done = workDone;
                if (time && !existing.appointmentTime) patch.appointment_time = time;
                if (status && !['cancelled', 'declined'].includes(existing.status)) patch.status = status;
                if (plannedWork && !existing.plannedWork) patch.planned_work = plannedWork;
                if (notes) patch.notes = existing.notes ? `${existing.notes} ${notes}` : notes;

                const { data, error } = await supabaseClient
                    .from('appointments')
                    .update(patch)
                    .eq('id', existing.id)
                    .eq('owner_id', ownerId)
                    .select('*')
                    .single();
                if (error) throw error;
                const mapped = mapAppointmentRow(data);
                upsertLocalAppointment(mapped);
                return mapped;
            }

            const payload = {
                owner_id: ownerId,
                patient_id: patient.id,
                appointment_date: date,
                appointment_time: time || null,
                status,
                planned_work: plannedWork,
                work_done: workDone || '',
                notes: notes || 'Visit recorded from patient record.'
            };
            const { data, error } = await supabaseClient
                .from('appointments')
                .insert(payload)
                .select('*')
                .single();
            if (error) throw error;
            const mapped = mapAppointmentRow(data);
            upsertLocalAppointment(mapped);
            return mapped;
        }

        async function ensureNextAppointmentRecord(patient, date, time = '') {
            if (!patient?.id || !date || isAdminViewingDoctor()) throw new Error('Administrator view is read-only.');
            if (date < localDateISO()) throw new Error('Next appointment date cannot be in the past.');
            const ownerId = patient.ownerId || appState.user?.id;
            if (!ownerId) throw new Error('Doctor ownership could not be determined.');

            const existing = getPatientAppointmentsForDate(patient.id, date)
                .filter(a => !['cancelled', 'declined', 'no_show', 'rescheduled'].includes(a.status))[0] || null;

            let appointment;
            if (existing) {
                const patch = { updated_at: new Date().toISOString() };
                if (time) patch.appointment_time = time;
                if (['requested'].includes(existing.status)) {
                    // Keep patient-originated requests waiting for doctor approval.
                } else if (!['confirmed'].includes(existing.status)) {
                    patch.status = 'scheduled';
                }
                const { data, error } = await supabaseClient
                    .from('appointments')
                    .update(patch)
                    .eq('id', existing.id)
                    .eq('owner_id', ownerId)
                    .select('*')
                    .single();
                if (error) throw error;
                appointment = mapAppointmentRow(data);
            } else {
                const { data, error } = await supabaseClient
                    .from('appointments')
                    .insert({
                        owner_id: ownerId,
                        patient_id: patient.id,
                        appointment_date: date,
                        appointment_time: time || null,
                        status: 'scheduled',
                        planned_work: '',
                        work_done: '',
                        notes: 'Next appointment scheduled from patient record.'
                    })
                    .select('*')
                    .single();
                if (error) throw error;
                appointment = mapAppointmentRow(data);
            }

            upsertLocalAppointment(appointment);
            return appointment;
        }

        function buildAppointmentCalendar(year, month) {
            const first = new Date(year, month, 1);
            const last = new Date(year, month + 1, 0);
            const daysInMonth = last.getDate();
            const mondayOffset = (first.getDay() + 6) % 7;
            const cells = [];
            for (let i = 0; i < mondayOffset; i++) cells.push(null);
            for (let d = 1; d <= daysInMonth; d++) {
                const date = localDateISO(new Date(year, month, d));
                cells.push(date);
            }
            while (cells.length % 7 !== 0) cells.push(null);
            return cells;
        }

        async function finishAuthentication(user) {
            if (!user || appState.authLoadingUserId === user.id) return;
            appState.authLoadingUserId = user.id;
            appState.user = user;
            appState.booting = true;
            render();
            try {
                await loadProfile(user);
                appState.viewingDoctorId = null;
                appState.viewingDoctorName = '';
                appState.viewingDoctorEmail = '';
                if (appState.role === 'admin') {
                    appState.doctors = await loadDoctorsForAdmin();
                    appState.patients = [];
                    appState.currentView = 'admin_dashboard';
                } else {
                    appState.patients = await loadCloudPatients(user.id);
                    appState.currentView = 'dashboard';
                }
                appState.booting = false;
                render();
            } catch (error) {
                console.error(error);
                appState.booting = false;
                await supabaseClient.auth.signOut();
                appState.user = null;
                appState.currentView = 'login';
                render();
                showToast(`Unable to load your clinical workspace: ${error.message || 'Unknown error'}`, 'error');
            } finally {
                appState.authLoadingUserId = null;
            }
        }

            const btn = document.querySelector('#login-form button[type="submit"]');
            if (!btn) return;
            btn.disabled = isBusy;
            btn.classList.toggle('opacity-60', isBusy);
            const span = btn.querySelector('span');
            if (span) span.textContent = text;
        }
